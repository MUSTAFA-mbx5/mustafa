<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة المصطفى | الصفحة الرئيسية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-1: #0b1120;
    --bg-2: #111d33;
    --glass: rgba(255, 255, 255, 0.08);
    --glass-strong: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --gold: #fbbf24;
    --gold-deep: #d97706;
    --neon: #22d3ee;
    --violet: #a78bfa;
    --pink: #f472b6;
    --green: #34d399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
    overflow-x: hidden;
    position: relative;
    background: radial-gradient(ellipse at 20% 0%, #16243d 0%, transparent 55%),
                radial-gradient(ellipse at 85% 100%, #1a1430 0%, transparent 55%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2) 50%, #0a0f1a);
    background-attachment: fixed;
  }

  /* ===== فقاعات ضوئية متحركة في الخلفية ===== */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
    animation: orbFloat 18s ease-in-out infinite;
  }
  .orb.a { width: 380px; height: 380px; background: #10b981; top: -120px; right: -100px; }
  .orb.b { width: 300px; height: 300px; background: #6366f1; bottom: -100px; left: -80px; animation-delay: -6s; }
  .orb.c { width: 240px; height: 240px; background: #d97706; top: 45%; left: 45%; animation-delay: -12s; opacity: 0.2; }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.12); }
    66% { transform: translate(-30px, 30px) scale(0.92); }
  }

  /* ===== الهيدر ===== */
  header {
    width: 100%;
    padding: 48px 20px 60px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  header h1 {
    font-size: 32px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: linear-gradient(100deg, #fff 20%, var(--gold) 55%, #fff 85%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shineText 4s linear infinite, dropIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  header h1 i {
    -webkit-text-fill-color: var(--green);
    font-size: 28px;
    animation: iconPulse 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(52, 211, 153, 0.7));
  }

  @keyframes shineText {
    to { background-position: -220% center; }
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-26px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes iconPulse {
    0%, 100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.14) rotate(-6deg); }
  }

  header p {
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 12px;
    letter-spacing: 1px;
    font-weight: 500;
    animation: dropIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
  }

  /* ===== الحاوية ===== */
  .container {
    width: 100%;
    max-width: 760px;
    padding: 0 20px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* ===== بطاقة ثواب الفاتحة الزجاجية ===== */
  .thawab-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.10), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(251, 191, 36, 0.28);
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
    overflow: hidden;
    animation: riseIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s both;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s;
  }

  .thawab-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 60px -20px rgba(251, 191, 36, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  /* لمعان يمر */
  .thawab-card::after {
    content: "";
    position: absolute;
    top: 0; left: -120%;
    width: 55%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: skewX(-18deg);
    animation: gloss 6s ease-in-out infinite;
  }

  @keyframes gloss {
    0%, 65% { left: -120%; }
    100% { left: 220%; }
  }

  .thawab-badge {
    position: absolute;
    top: 14px; left: 18px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    padding: 3px 10px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    display: flex; align-items: center; gap: 4px;
    box-shadow: 0 4px 12px rgba(217, 119, 6, 0.5);
    z-index: 3;
  }

  .thawab-img-box {
    position: relative;
    width: 74px; height: 74px;
    flex-shrink: 0;
    z-index: 2;
  }

  .thawab-img-box::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), #fff7e0, var(--gold), #b45309, var(--gold));
    animation: spinRing 4s linear infinite;
    z-index: -1;
  }

  @keyframes spinRing { to { transform: rotate(360deg); } }

  .thawab-img-box img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transition: transform 0.4s;
    position: relative; z-index: 1;
  }

  .thawab-card:hover .thawab-img-box img { transform: scale(1.08) rotate(4deg); }

  .thawab-text { flex: 1; text-align: right; position: relative; z-index: 2; }

  .thawab-text h3 {
    font-size: 16px; font-weight: 800; color: #fff;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 7px;
  }
  .thawab-text h3 i { color: var(--gold); font-size: 14px; }

  .thawab-text p {
    font-size: 13px; line-height: 1.7; color: #cbd5e1;
  }
  .thawab-text p strong { color: var(--gold); font-weight: 800; }

  /* ===== الصندوق الرئيسي الزجاجي ===== */
  .main-box {
    position: relative;
    padding: 26px 24px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 25px 60px -25px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
    animation: riseIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s both;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(36px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .section-title {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 16px;
    margin-bottom: 20px;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .section-title::after {
    content: "";
    position: absolute;
    bottom: -1px; right: 0;
    width: 70px; height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--green), transparent);
  }

  .section-title i {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 13px;
    font-size: 16px;
    color: var(--green);
    background: rgba(52, 211, 153, 0.12);
    border: 1px solid rgba(52, 211, 153, 0.3);
    box-shadow: 0 0 20px rgba(52, 211, 153, 0.18), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  /* ===== شبكة الأزرار ===== */
  #buttons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
  }

  /* ===== زر iOS الزجاجي ===== */
  .page-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 18px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    color: #f1f5f9;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    box-shadow: 0 6px 18px -6px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.25),
                inset 0 -1px 0 rgba(0,0,0,0.15);
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.32s,
                border-color 0.32s;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    animation: popIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ألوان متنوعة لكل زر حسب ترتيبه */
  .page-btn:nth-child(6n+1) { --c1: #34d399; --c2: #059669; --glow: rgba(52,211,153,0.5); }
  .page-btn:nth-child(6n+2) { --c1: #22d3ee; --c2: #0891b2; --glow: rgba(34,211,238,0.5); }
  .page-btn:nth-child(6n+3) { --c1: #a78bfa; --c2: #7c3aed; --glow: rgba(167,139,250,0.5); }
  .page-btn:nth-child(6n+4) { --c1: #f472b6; --c2: #db2777; --glow: rgba(244,114,182,0.5); }
  .page-btn:nth-child(6n+5) { --c1: #fbbf24; --c2: #d97706; --glow: rgba(251,191,36,0.5); }
  .page-btn:nth-child(6n+6) { --c1: #60a5fa; --c2: #2563eb; --glow: rgba(96,165,250,0.5); }

  /* هالة لونية خلف الزر */
  .page-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 20% 20%, var(--c1, #34d399), transparent 60%),
                radial-gradient(circle at 90% 90%, var(--c2, #059669), transparent 60%);
    opacity: 0.18;
    z-index: -2;
    transition: opacity 0.35s;
  }

  /* لمعان زجاجي يمر عند المرور (لمعة iOS) */
  .page-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -130%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-22deg);
    z-index: 0;
    transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .page-btn:hover::after { left: 140%; }

  .page-btn:hover {
    transform: translateY(-5px) scale(1.03);
    border-color: rgba(255,255,255,0.4);
    box-shadow: 0 18px 36px -10px var(--glow, rgba(52,211,153,0.5)),
                inset 0 1px 0 rgba(255,255,255,0.4),
                inset 0 -1px 0 rgba(0,0,0,0.15);
  }

  .page-btn:hover::before { opacity: 0.4; }

  .page-btn:active {
    transform: translateY(-1px) scale(0.98);
    box-shadow: 0 6px 14px -6px var(--glow), inset 0 2px 6px rgba(0,0,0,0.3);
  }

  .page-btn span {
    position: relative;
    z-index: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  .page-btn .ico {
    position: relative;
    z-index: 2;
    width: 30px; height: 30px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px;
    font-size: 12px;
    color: #fff;
    background: linear-gradient(135deg, var(--c1, #34d399), var(--c2, #059669));
    box-shadow: 0 4px 10px -2px var(--glow, rgba(52,211,153,0.5)),
                inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.3s;
  }

  .page-btn:hover .ico { transform: translateX(-4px) rotate(-6deg); }

  /* ===== حالة التحميل / الخطأ ===== */
  .status-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 34px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    animation: fadePulse 1.6s ease-in-out infinite;
  }

  @keyframes fadePulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .status-msg i {
    display: block;
    font-size: 30px;
    margin-bottom: 14px;
    color: var(--green);
    filter: drop-shadow(0 0 12px rgba(52,211,153,0.6));
  }

  /* ===== الفوتر ===== */
  footer {
    margin-top: 38px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 7px;
    z-index: 5;
    animation: riseIn 1s ease 0.7s both;
  }
  footer i { color: var(--pink); animation: heartBeat 1.6s ease-in-out infinite; }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.25); }
    50% { transform: scale(1); }
  }

  /* ===== استجابة الجوال ===== */
  @media (max-width: 520px) {
    header { padding: 38px 16px 44px; }
    header h1 { font-size: 23px; gap: 9px; }
    header h1 i { font-size: 20px; }
    header p { font-size: 12px; }
    .container { padding: 0 14px; gap: 20px; }
    .thawab-card { padding: 18px; gap: 14px; flex-wrap: wrap; }
    .thawab-img-box { width: 62px; height: 62px; }
    .thawab-text h3 { font-size: 14px; }
    .thawab-text p { font-size: 12px; }
    .main-box { padding: 20px 16px 22px; }
    .section-title { font-size: 16px; }
    #buttons { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .page-btn { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <!-- فقاعات الخلفية -->
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <!-- الهيدر -->
  <header>
    <h1><i class="fas fa-book-open"></i> نظام مكتبة المصطفى</h1>
    <p>بوابة الخدمات والصفحات المتاحة</p>
  </header>

  <div class="container">

    <!-- بطاقة ثواب الفاتحة -->
    <div class="thawab-card">
      <div class="thawab-badge"><i class="fas fa-star"></i> ثواب الفاتحة</div>
      <div class="thawab-img-box">
        <img src="1.jpg" alt="المرحوم حسن ابن نزيلة" onerror="this.src='https://via.placeholder.com/74?text=رحمه+الله'">
      </div>
      <div class="thawab-text">
        <h3><i class="fas fa-hands-praying"></i> إهداء ثواب سورة الفاتحة</h3>
        <p>نسألكم القراءة وإهداء ثوابها إلى روح المرحوم المغفور له بإذن الله <strong>(حسن ابن نزيلة)</strong>.</p>
      </div>
    </div>

    <!-- قائمة الصفحات -->
    <div class="main-box">
      <div class="section-title">
        <i class="fas fa-layer-group"></i> الصفحات والأدوات المتاحة
      </div>
      <div id="buttons">
        <div class="status-msg">
          <i class="fas fa-spinner fa-spin"></i>
          جاري جلب قائمة الصفحات...
        </div>
      </div>
    </div>

    <footer>
      <i class="fas fa-heart"></i> موقع مجاني وغير مبري ذمه لمن يسرق اداه ويحذف حقوقها او ينسب الفضل له
    </footer>

  </div>

<script>
  const username = "MUSTAFA-mbx5";
  const repo = "mustafa";
  const container = document.getElementById("buttons");

  const icons = ["fa-file-lines", "fa-book", "fa-scroll", "fa-tablet-screen-button", "fa-bookmark", "fa-feather"];

  fetch(`https://api.github.com/repos/${username}/${repo}/contents/`)
    .then(res => {
      if (!res.ok) throw new Error("تعذر الوصول");
      return res.json();
    })
    .then(files => {
      container.innerHTML = "";

      const htmlFiles = files.filter(f =>
        f.name.endsWith(".html") && f.name.toLowerCase() !== "index.html"
      );

      if (htmlFiles.length === 0) {
        container.innerHTML = `<div class="status-msg"><i class="fas fa-folder-open"></i>لا توجد صفحات متاحة حالياً.</div>`;
        return;
      }

      htmlFiles.forEach((file, i) => {
        const btn = document.createElement("button");
        btn.className = "page-btn";
        btn.style.animationDelay = (0.45 + i * 0.08) + "s";

        const name = file.name.replace(/\.html$/i, "");
        const icon = icons[i % icons.length];

        btn.innerHTML = `
          <span>${name}</span>
          <span class="ico"><i class="fas ${icon}"></i></span>
        `;

        btn.addEventListener("click", () => {
          btn.style.transition = "transform 0.25s ease, opacity 0.25s ease";
          btn.style.transform = "scale(0.94)";
          btn.style.opacity = "0.5";
          setTimeout(() => { window.location.href = file.name; }, 180);
        });

        container.appendChild(btn);
      });
    })
    .catch(err => {
      console.error(err);
      container.innerHTML = `
        <div class="status-msg" style="color:#f87171;">
          <i class="fas fa-triangle-exclamation" style="color:#f87171;"></i>
          تعذر تحميل الصفحات. تأكد من الاتصال وحاول مجدداً.
        </div>`;
    });
</script>

</body>
</html>
