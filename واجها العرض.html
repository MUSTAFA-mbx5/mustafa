<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة المصطفى | الصفحة الرئيسية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --primary: #0f172a;
    --primary-light: #1e293b;
    --accent: #10b981;
    --accent-hover: #059669;
    --accent-glow: rgba(16, 185, 129, 0.4);
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-color: #334155;
    --gold: #d97706;
    --gold-light: #fbbf24;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 60px;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(217, 119, 6, 0.05) 0%, transparent 40%);
    background-attachment: fixed;
  }

  /* ===== الهيدر ===== */
  header {
    width: 100%;
    background: linear-gradient(135deg, #0b1120 0%, #1e293b 60%, #0f172a 100%);
    color: white;
    padding: 50px 20px 70px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(15, 23, 42, 0.4);
    position: relative;
    overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
  }

  /* دوائر متحركة خلف الهيدر */
  header::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15), transparent 70%);
    top: -250px;
    right: -150px;
    animation: float 12s ease-in-out infinite;
  }

  header::after {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 119, 6, 0.12), transparent 70%);
    bottom: -180px;
    left: -100px;
    animation: float 15s ease-in-out infinite reverse;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, 20px) scale(1.1); }
  }

  header h1 {
    font-size: 32px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    position: relative;
    z-index: 2;
    animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  header h1 i {
    color: var(--accent);
    animation: pulseIcon 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }

  @keyframes pulseIcon {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.15) rotate(-5deg); }
  }

  header p {
    font-size: 15px;
    color: #94a3b8;
    margin-top: 10px;
    position: relative;
    z-index: 2;
    font-weight: 400;
    letter-spacing: 0.5px;
    animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* شريط زخرفي متحرك */
  .header-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--gold-light), var(--accent), transparent);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    z-index: 3;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== الحاوية ===== */
  .container {
    width: 100%;
    max-width: 720px;
    padding: 0 20px;
    margin-top: -45px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ===== بطاقة ثواب الفاتحة ===== */
  .thawab-card {
    background: linear-gradient(135deg, #ffffff 0%, #fefefe 50%, #f8fafc 100%);
    border: 1px solid #e2e8f0;
    border-radius: 22px;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 20px 40px -15px rgba(217, 119, 6, 0.2), 0 0 0 1px rgba(217, 119, 6, 0.05);
    position: relative;
    overflow: hidden;
    animation: cardReveal 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s;
  }

  .thawab-card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 30px 55px -15px rgba(217, 119, 6, 0.3), 0 0 0 1px rgba(217, 119, 6, 0.1);
  }

  .thawab-card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 5px;
    height: 100%;
    background: linear-gradient(180deg, var(--gold-light), var(--gold), var(--gold-light));
    background-size: 100% 200%;
    animation: goldFlow 3s ease-in-out infinite;
  }

  @keyframes goldFlow {
    0%, 100% { background-position: 0 0; }
    50% { background-position: 0 100%; }
  }

  /* لمعان يمر على البطاقة */
  .thawab-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    transform: skewX(-20deg);
    animation: shine 5s ease-in-out infinite;
  }

  @keyframes shine {
    0%, 70% { left: -100%; }
    100% { left: 200%; }
  }

  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .thawab-badge {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 10px;
    font-weight: 800;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #92400e;
    padding: 3px 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(217, 119, 6, 0.15);
    z-index: 2;
  }

  .thawab-img-box {
    position: relative;
    width: 76px;
    height: 76px;
    flex-shrink: 0;
    z-index: 2;
  }

  .thawab-img-box::before {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), var(--gold-light), var(--gold), var(--gold-light), var(--gold));
    animation: rotateRing 4s linear infinite;
    z-index: -1;
  }

  @keyframes rotateRing {
    to { transform: rotate(360deg); }
  }

  .thawab-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #fff;
    position: relative;
    z-index: 1;
    box-shadow: 0 6px 16px rgba(217, 119, 6, 0.25);
    transition: transform 0.4s;
  }

  .thawab-card:hover .thawab-img-box img {
    transform: scale(1.08) rotate(3deg);
  }

  .thawab-text {
    text-align: right;
    position: relative;
    z-index: 2;
    flex: 1;
  }

  .thawab-text h3 {
    font-size: 16px;
    color: #0f172a;
    font-weight: 800;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .thawab-text h3 i {
    color: var(--gold);
    font-size: 14px;
  }

  .thawab-text p {
    font-size: 13px;
    color: #64748b;
    line-height: 1.7;
  }

  .thawab-text p strong {
    color: #b45309;
    font-weight: 700;
  }

  /* ===== الصندوق الرئيسي ===== */
  .main-box {
    background: var(--card-bg);
    padding: 28px 26px;
    border-radius: 24px;
    box-shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(15, 23, 42, 0.04);
    animation: cardReveal 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.45s both;
  }

  .section-title {
    font-size: 19px;
    color: var(--primary);
    font-weight: 800;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 2px solid #f1f5f9;
    position: relative;
  }

  .section-title::after {
    content: "";
    position: absolute;
    bottom: -2px;
    right: 0;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .section-title i {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #ecfdf5, #d1fae5);
    color: var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 4px 10px rgba(16, 185, 129, 0.15);
  }

  /* ===== شبكة الأزرار ===== */
  #buttons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .page-btn {
    background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
    color: var(--primary-light);
    border: 1.5px solid #e2e8f0;
    padding: 16px 18px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(15px);
    animation: btnAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes btnAppear {
    to { opacity: 1; transform: translateY(0); }
  }

  /* لمعان عند المرور */
  .page-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-25deg);
    transition: left 0.6s;
  }

  .page-btn:hover::before {
    left: 100%;
  }

  .page-btn span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }

  .page-btn i {
    color: #94a3b8;
    font-size: 14px;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }

  .page-btn:hover {
    background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
    color: white;
    border-color: transparent;
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 12px 25px -5px var(--accent-glow), 0 4px 10px rgba(0,0,0,0.05);
  }

  .page-btn:hover i {
    color: white;
    transform: translateX(-5px);
  }

  .page-btn:active {
    transform: translateY(-1px) scale(0.99);
  }

  /* ===== حالة التحميل ===== */
  .status-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 30px 20px;
    color: #64748b;
    font-size: 14px;
    font-weight: 600;
    animation: fadePulse 1.5s ease-in-out infinite;
  }

  @keyframes fadePulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .status-msg i {
    font-size: 28px;
    margin-bottom: 12px;
    display: block;
    color: var(--accent);
  }

  /* ===== الفوتر ===== */
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: cardReveal 1s ease 0.7s both;
  }

  footer i {
    color: var(--accent);
  }

  /* ===== استجابة الجوال ===== */
  @media (max-width: 480px) {
    header { padding: 40px 16px 60px; clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%); }
    header h1 { font-size: 24px; gap: 10px; }
    header p { font-size: 13px; }
    .container { padding: 0 14px; margin-top: -35px; }
    .thawab-card { padding: 18px; gap: 14px; flex-wrap: wrap; }
    .thawab-img-box { width: 64px; height: 64px; }
    .thawab-text h3 { font-size: 14px; }
    .thawab-text p { font-size: 12px; }
    .main-box { padding: 20px 16px; }
    .section-title { font-size: 17px; }
    #buttons { grid-template-columns: 1fr; }
    .page-btn { padding: 14px 16px; }
    .thawab-badge { font-size: 9px; padding: 2px 8px; }
  }

  /* تقليل الحركة لمن يفضّل ذلك */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <h1><i class="fas fa-book-open"></i> نظام مكتبة المصطفى</h1>
    <p>بوابة الخدمات والصفحات المتاحة</p>
    <div class="header-line"></div>
  </header>

  <!-- الحاوية الرئيسية -->
  <div class="container">

    <!-- بطاقة إهداء ثواب الفاتحة -->
    <div class="thawab-card">
      <div class="thawab-badge"><i class="fas fa-star"></i> ثواب الفاتحة</div>
      <div class="thawab-img-box">
        <img src="1.jpg" alt="المرحوم حسن ابن نزيلة" onerror="this.src='https://via.placeholder.com/76?text=رحمه+الله'">
      </div>
      <div class="thawab-text">
        <h3><i class="fas fa-hands-praying"></i> إهداء ثواب سورة الفاتحة</h3>
        <p>نسألكم القراءة وإهداء ثوابها إلى روح المرحوم المغفور له بإذن الله <strong>(حسن ابن نزيلة)</strong>.</p>
      </div>
    </div>

    <!-- قائمة الصفحات -->
    <div class="main-box">
      <div class="section-title">
        <i class="fas fa-layer-group"></i> الصفحات والأدوات المتاحة
      </div>
      <div id="buttons">
        <div class="status-msg">
          <i class="fas fa-spinner fa-spin"></i>
          جاري جلب قائمة الصفحات...
        </div>
      </div>
    </div>

    <footer>
      <i class="fas fa-heart"></i> صُنع بحب لخدمة كتاب الله
    </footer>

  </div>

<script>
  const username = "MUSTAFA-mbx5";
  const repo = "mustafa";
  const container = document.getElementById("buttons");

  fetch(`https://api.github.com/repos/${username}/${repo}/contents/`)
    .then(res => {
      if(!res.ok) throw new Error("تعذر الوصول للملفات");
      return res.json();
    })
    .then(files => {
      container.innerHTML = "";

      const htmlFiles = files.filter(file =>
        file.name.endsWith(".html") && file.name.toLowerCase() !== "index.html"
      );

      if (htmlFiles.length === 0) {
        container.innerHTML = `<div class="status-msg"><i class="fas fa-folder-open"></i>لا توجد صفحات متاحة حالياً.</div>`;
        return;
      }

      htmlFiles.forEach((file, index) => {
        const btn = document.createElement("button");
        btn.className = "page-btn";
        btn.style.animationDelay = `${0.5 + index * 0.07}s`;

        const fileNameWithoutExt = file.name.replace(/\.html$/i, "");

        btn.innerHTML = `
          <span>${fileNameWithoutExt}</span>
          <i class="fas fa-arrow-left"></i>
        `;

        btn.onclick = () => {
          // تأثير خروج ناعم قبل الانتقال
          btn.style.transition = "all 0.3s ease";
          btn.style.transform = "scale(0.95)";
          btn.style.opacity = "0.6";
          setTimeout(() => window.location.href = file.name, 200);
        };
        container.appendChild(btn);
      });
    })
    .catch(err => {
      console.error("خطأ في جلب الملفات:", err);
      container.innerHTML = `
        <div class="status-msg" style="color: #ef4444;">
          <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
          حدث خطأ أثناء تحميل الصفحات. يرجى المحاولة لاحقاً.
        </div>`;
    });
</script>

</body>
</html>
