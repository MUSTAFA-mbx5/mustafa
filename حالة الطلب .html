<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الصيانة والمكتبة | iOS Glass</title>
  <style>
    /* متغيرات الألوان وثيمات الزجاج */
    :root {
      --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-card: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
      --text-color: #1c1c1e;
      --primary-color: #007aff;
      --primary-glow: rgba(0, 122, 255, 0.3);
      --input-bg: rgba(255, 255, 255, 0.5);
    }

    body.dark-theme {
      --bg-gradient: radial-gradient(circle at top left, #2a0845, #10002b 70%);
      --glass-bg: rgba(26, 18, 38, 0.5);
      --glass-card: rgba(36, 23, 56, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      --text-color: #f2f2f7;
      --primary-color: #af52de;
      --primary-glow: rgba(175, 82, 222, 0.4);
      --input-bg: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      min-height: 100vh;
      padding-bottom: 60px;
      transition: all 0.4s ease;
    }

    /* خلفية متوهجة ديكورية للزجاج */
    .glow-blob {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--primary-color);
      filter: blur(120px);
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 { top: -50px; right: -50px; }
    .blob-2 { bottom: -50px; left: -50px; }

    /* الهيدر الزجاجي */
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--glass-shadow);
    }

    header h2 { font-weight: 700; font-size: 20px; letter-spacing: -0.5px; }

    .theme-btn {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }
    .theme-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary-glow); }

    /* تبويبات الأيفون Segmented Control */
    .tabs-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }
    .tabs {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      padding: 5px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      display: flex;
      gap: 5px;
      box-shadow: var(--glass-shadow);
    }
    .tab-btn {
      padding: 10px 24px;
      border: none;
      background: transparent;
      color: var(--text-color);
      font-size: 15px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tab-btn.active {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    /* الكروت الزجاجية */
    .glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(25px) saturate(190%);
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 30px;
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: 600; opacity: 0.9; }
    
    .input-group input, .input-group select {
      padding: 12px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: var(--input-bg);
      color: var(--text-color);
      outline: none;
      font-size: 15px;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }
    .input-group input:focus, .input-group select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .faults-section { margin-top: 20px; border-top: 1px solid var(--glass-border); padding-top: 15px; }
    .fault-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .fault-row input { flex: 1; }

    .btn-add {
      background: rgba(52, 199, 89, 0.2);
      border: 1px solid #34c759;
      color: #34c759;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .btn-submit {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 8px 20px var(--primary-glow);
      transition: 0.3s;
    }
    .btn-submit:hover { transform: translateY(-2px); opacity: 0.95; }

    /* فقاعات كروت الطلبات (Glass Bubble Cards) */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
    
    .order-bubble {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: relative;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
    }
    .order-bubble:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    }

    /* ألوان حالات الزجاج */
    .order-bubble.status-pending { border-right: 6px solid #ff3b30; }
    .order-bubble.status-progress { border-right: 6px solid #ffcc00; }
    .order-bubble.status-done { border-right: 6px solid #34c759; }

    .badge {
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }
    .bg-pending { background: rgba(255, 59, 48, 0.2); color: #ff3b30; border: 1px solid #ff3b30; }
    .bg-progress { background: rgba(255, 204, 0, 0.2); color: #d69e00; border: 1px solid #ffcc00; }
    .bg-done { background: rgba(52, 199, 89, 0.2); color: #34c759; border: 1px solid #34c759; }

    /* النافذة المنبثقة (iOS Glass Modal) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: var(--glass-card);
      backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      padding: 28px;
      border-radius: 28px;
      width: 90%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .whatsapp-btn {
      background: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 15px;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
      transition: 0.3s;
    }
    .whatsapp-btn:hover { transform: scale(1.02); }

    .action-btn-danger {
      background: rgba(255, 59, 48, 0.15);
      border: 1px solid #ff3b30;
      color: #ff3b30;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <header>
    <h2>نظام إدارة الصيانة والطلبات</h2>
    <button class="theme-btn" onclick="toggleTheme()">الثيم 🌙/☀️</button>
  </header>

  <div class="tabs-container">
    <div class="tabs">
      <button class="tab-btn active" id="tab-devices" onclick="switchTab('devices')">📱 الأجهزة والصيانة</button>
      <button class="tab-btn" id="tab-library" onclick="switchTab('library')">📚 المكتبة والطباعة</button>
    </div>
  </div>

  <div class="container">
    
    <!-- نموذج تسجيل طلب -->
    <div class="glass-card">
      <h3 id="form-title" style="margin-bottom: 18px;">تسجيل جهاز جديد للصيانة</h3>
      <form id="orderForm" onsubmit="handleFormSubmit(event)">
        <div class="form-grid">
          <div class="input-group">
            <label>اسم الزبون:</label>
            <input type="text" id="custName" required placeholder="مثال: أحمد علي">
          </div>
          <div class="input-group">
            <label id="lbl-itemType">نوع الجهاز:</label>
            <input type="text" id="itemType" required placeholder="مثال: آيفون 13 برو">
          </div>
          <div class="input-group" id="group-color">
            <label id="lbl-color">لون الجهاز:</label>
            <input type="text" id="itemColor" placeholder="مثال: أزرق">
          </div>
          <div class="input-group">
            <label>رقم الهاتف (عراقي):</label>
            <input type="text" id="custPhone" required placeholder="مثال: 07801234567">
          </div>
        </div>

        <div class="faults-section">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <label id="lbl-faults">قائمة الأعطال والتكاليف:</label>
            <button type="button" class="btn-add" onclick="addFaultInput()">+ إضافة بند</button>
          </div>
          <div id="faultsContainer"></div>
        </div>

        <button type="submit" class="btn-submit">حفظ وتسجيل الطلب</button>
      </form>
    </div>

    <!-- قائمة عرض الطلبات -->
    <h3 style="margin-bottom: 16px; font-size: 18px;">الطلبات الحالية:</h3>
    <div class="orders-grid" id="ordersGrid"></div>

  </div>

  <!-- النافذة المنبثقة التفاصيل والتعديل الفوري -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <h3 id="modalTitle" style="margin-bottom: 15px;">تفاصيل الطلب</h3>
      
      <div id="modalStaticInfo"></div>

      <div class="input-group" style="margin: 15px 0;">
        <label>تغيير حالة الطلب:</label>
        <select id="modalStatusSelect" onchange="onModalStatusChange()">
          <option value="pending">🔴 قيد الانتظار</option>
          <option value="progress">🟡 قيد الصيانة / العمل</option>
          <option value="done">🟢 مكتمل</option>
        </select>
      </div>

      <!-- قسم تعديل/إضافة الأعطال داخل النافذة -->
      <div class="faults-section" style="margin-bottom: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <label style="font-size: 14px; font-weight: bold;">تعديل الأعطال والملاحظات:</label>
          <button type="button" class="btn-add" onclick="addModalFaultRow()">+ إضافة عطل جديد</button>
        </div>
        <div id="modalItemsContainer"></div>
        <h4 id="modalTotalCostDisplay" style="margin-top: 10px; color: var(--primary-color);"></h4>
      </div>

      <div id="whatsappContainer"></div>

      <button class="action-btn-danger" onclick="deleteCurrentOrder()">حذف الطلب نهائياً</button>
      <button style="margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); cursor: pointer; font-weight: 600;" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <script>
    let currentTab = 'devices';
    let orders = JSON.parse(localStorage.getItem('my_orders_data')) || [];
    let activeOrderId = null;

    window.onload = () => {
      addFaultInput();
      renderOrders();
    };

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-devices').classList.toggle('active', tab === 'devices');
      document.getElementById('tab-library').classList.toggle('active', tab === 'library');

      const isDev = tab === 'devices';
      document.getElementById('form-title').innerText = isDev ? 'تسجيل جهاز جديد للصيانة' : 'تسجيل طلب مكتبة / طباعة جديد';
      document.getElementById('lbl-itemType').innerText = isDev ? 'نوع الجهاز:' : 'نوع الكتاب / المادة:';
      document.getElementById('group-color').style.display = isDev ? 'flex' : 'none';
      document.getElementById('lbl-faults').innerText = isDev ? 'قائمة الأعطال والتكاليف:' : 'قائمة الخدمات والأسعار:';
      
      renderOrders();
    }

    function addFaultInput(name = '', cost = '') {
      const div = document.createElement('div');
      div.className = 'fault-row';
      div.innerHTML = `
        <input type="text" placeholder="${currentTab === 'devices' ? 'اسم العطل' : 'اسم الخدمة/الطباعة'}" value="${name}" class="f-name" required>
        <input type="number" placeholder="التكلفة (د.ع)" value="${cost}" class="f-cost" required>
        <button type="button" style="background:rgba(255,59,48,0.2); border:1px solid #ff3b30; color:#ff3b30; padding:0 10px; border-radius:10px; cursor:pointer;" onclick="this.parentElement.remove()">✕</button>
      `;
      document.getElementById('faultsContainer').appendChild(div);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      
      const faultRows = document.querySelectorAll('#faultsContainer .fault-row');
      let items = [];
      let total = 0;

      faultRows.forEach(row => {
        const name = row.querySelector('.f-name').value;
        const cost = parseFloat(row.querySelector('.f-cost').value) || 0;
        items.push({ name, cost });
        total += cost;
      });

      const newOrder = {
        id: Date.now(),
        category: currentTab,
        custName: document.getElementById('custName').value,
        itemType: document.getElementById('itemType').value,
        itemColor: currentTab === 'devices' ? document.getElementById('itemColor').value : '',
        custPhone: document.getElementById('custPhone').value,
        status: 'pending',
        items: items,
        totalCost: total
      };

      orders.push(newOrder);
      saveAndRefresh();
      
      document.getElementById('orderForm').reset();
      document.getElementById('faultsContainer').innerHTML = '';
      addFaultInput();
    }

    function saveAndRefresh() {
      localStorage.setItem('my_orders_data', JSON.stringify(orders));
      renderOrders();
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      grid.innerHTML = '';

      const filtered = orders.filter(o => o.category === currentTab);

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; opacity: 0.7;">لا توجد طلبات مسجلة في هذا القسم.</p>';
        return;
      }

      filtered.forEach(o => {
        const bubble = document.createElement('div');
        bubble.className = `order-bubble status-${o.status}`;
        
        let statusText = o.status === 'pending' ? '🔴 قيد الانتظار' : (o.status === 'progress' ? '🟡 قيد الصيانة' : '🟢 مكتمل');
        let statusBg = o.status === 'pending' ? 'bg-pending' : (o.status === 'progress' ? 'bg-progress' : 'bg-done');

        bubble.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <strong style="font-size: 16px;">${o.custName}</strong>
            <span class="badge ${statusBg}">${statusText}</span>
          </div>
          <p style="font-size: 14px; margin-bottom: 6px; opacity:0.9;">📌 ${o.itemType} ${o.itemColor ? '(' + o.itemColor + ')' : ''}</p>
          <p style="font-size: 16px; font-weight: 700; color: var(--primary-color);">المجموع: ${o.totalCost.toLocaleString()} د.ع</p>
        `;

        bubble.onclick = () => openModal(o.id);
        grid.appendChild(bubble);
      });
    }

    function openModal(id) {
      activeOrderId = id;
      const order = orders.find(o => o.id === id);
      if (!order) return;

      document.getElementById('modalTitle').innerText = `طلب: ${order.custName}`;
      document.getElementById('modalStatusSelect').value = order.status;

      document.getElementById('modalStaticInfo').innerHTML = `
        <p><strong>نوع الطلب:</strong> ${order.itemType} ${order.itemColor ? '- لون ' + order.itemColor : ''}</p>
        <p><strong>رقم الهاتف:</strong> ${order.custPhone}</p>
        <hr style="margin: 12px 0; border:0; border-top:1px solid var(--glass-border);">
      `;

      renderModalItemsEditor(order);
      updateWhatsAppButton(order);
      document.getElementById('detailsModal').style.display = 'flex';
    }

    /* عرض وتعديل الأعطال داخل النافذة مباشرة */
    function renderModalItemsEditor(order) {
      const container = document.getElementById('modalItemsContainer');
      container.innerHTML = '';

      order.items.forEach((it, index) => {
        const div = document.createElement('div');
        div.className = 'fault-row';
        div.innerHTML = `
          <input type="text" value="${it.name}" class="m-f-name" onchange="updateOrderFromModal()">
          <input type="number" value="${it.cost}" class="m-f-cost" onchange="updateOrderFromModal()">
          <button type="button" style="background:rgba(255,59,48,0.2); border:1px solid #ff3b30; color:#ff3b30; padding:0 8px; border-radius:8px; cursor:pointer;" onclick="removeModalFaultRow(${index})">✕</button>
        `;
        container.appendChild(div);
      });

      document.getElementById('modalTotalCostDisplay').innerText = `المجموع الكلي: ${order.totalCost.toLocaleString()} د.ع`;
    }

    function addModalFaultRow() {
      const order = orders.find(o => o.id === activeOrderId);
      if (order) {
        order.items.push({ name: 'عطل إضافي / ملاحظة', cost: 0 });
        updateOrderFromModal();
      }
    }

    function removeModalFaultRow(index) {
      const order = orders.find(o => o.id === activeOrderId);
      if (order) {
        order.items.splice(index, 1);
        updateOrderFromModal();
      }
    }

    function updateOrderFromModal() {
      const order = orders.find(o => o.id === activeOrderId);
      if (!order) return;

      const rows = document.querySelectorAll('#modalItemsContainer .fault-row');
      let items = [];
      let total = 0;

      rows.forEach(row => {
        const name = row.querySelector('.m-f-name').value;
        const cost = parseFloat(row.querySelector('.m-f-cost').value) || 0;
        items.push({ name, cost });
        total += cost;
      });

      order.items = items;
      order.totalCost = total;

      saveAndRefresh();
      renderModalItemsEditor(order);
      updateWhatsAppButton(order);
    }

    function onModalStatusChange() {
      const order = orders.find(o => o.id === activeOrderId);
      if (order) {
        order.status = document.getElementById('modalStatusSelect').value;
        saveAndRefresh();
        updateWhatsAppButton(order);
      }
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    function formatIraqiPhone(phone) {
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('07')) {
        cleaned = '964' + cleaned.substring(1);
      } else if (cleaned.startsWith('7')) {
        cleaned = '964' + cleaned;
      }
      return cleaned;
    }

    /* تحديث صيغة رسائل الواتساب المطلوبة بالضبط */
    function updateWhatsAppButton(order) {
      const container = document.getElementById('whatsappContainer');
      container.innerHTML = '';

      if (order.status === 'pending') return;

      const phoneFormatted = formatIraqiPhone(order.custPhone);
      let msg = '';

      if (order.status === 'progress') {
        msg = `مرحبا ${order.custName}\nنوع ${order.category === 'devices' ? 'جهازك' : 'طلبك'}: (${order.itemType})\nحالة الطلب: ${order.category === 'devices' ? 'قيد الصيانة' : 'قيد التجهيز'}\nسوف يتم إعلامك حين اكتماله.`;
      } else if (order.status === 'done') {
        let itemsList = order.items.map(i => `- ${i.name}: ${i.cost.toLocaleString()} د.ع`).join('\n');
        msg = `مرحبا ${order.custName}\nاكتمل ${order.category === 'devices' ? 'جهازك' : 'طلبك'} (${order.itemType})\n\nالتفاصيل والأعطال:\n${itemsList}\n\nالمجموع الكلي: ${order.totalCost.toLocaleString()} د.ع\n\nشكراً لثقتكم بنا! ❤️`;
      }

      const encodedMsg = encodeURIComponent(msg);
      const waUrl = `https://wa.me/${phoneFormatted}?text=${encodedMsg}`;

      container.innerHTML = `
        <a href="${waUrl}" target="_blank" class="whatsapp-btn">
          💬 إرسال التحديث عبر الواتساب
        </a>
      `;
    }

    function deleteCurrentOrder() {
      if (confirm('هل أنت تأكد من حذف هذا الطلب؟')) {
        orders = orders.filter(o => o.id !== activeOrderId);
        saveAndRefresh();
        closeModal();
      }
    }
  </script>
</body>
</html>
