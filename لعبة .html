<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora — Neon Cosmos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#03030a; font-family:'Segoe UI', Tahoma, sans-serif; }
  canvas { display:block; }

  /* vignette طبقة فوق الكانفس */
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }

  #hud {
    position:fixed; top:18px; right:22px; z-index:10;
    color:#c8f8ff; font-size:14px; letter-spacing:1px;
    text-shadow:0 0 12px #00e0ff, 0 0 24px #00a0ff;
    line-height:1.9; pointer-events:none;
  }
  #hud b { color:#fff; font-weight:600; }
  #hud .lbl { color:#7ac4ff; }

  /* شريط الطاقة أسفل الشاشة */
  #energyWrap {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    width:min(420px, 70vw); height:8px; z-index:10;
    background:rgba(255,255,255,0.06);
    border-radius:99px; overflow:hidden;
    box-shadow:0 0 20px rgba(0,224,255,0.4), inset 0 0 6px rgba(0,0,0,0.6);
    pointer-events:none;
  }
  #energy {
    height:100%; width:100%;
    background:linear-gradient(90deg, #00e0ff, #a26bff, #ff5cc8);
    box-shadow:0 0 15px currentColor;
    transition:width 0.2s ease-out;
  }

  /* الأزرار أعلى اليسار */
  #topLeft {
    position:fixed; top:18px; left:22px; z-index:10;
    display:flex; gap:8px;
  }
  #topLeft button {
    background:rgba(20,30,60,0.4);
    color:#c8f8ff; border:1px solid rgba(0,224,255,0.35);
    padding:6px 12px; font-size:12px; letter-spacing:1px;
    border-radius:8px; cursor:pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 15px rgba(0,224,255,0.15);
    transition:0.2s;
  }
  #topLeft button:hover {
    background:rgba(0,224,255,0.15);
    box-shadow: 0 0 25px rgba(0,224,255,0.5);
    color:#fff;
  }

  /* شاشة البداية / النهاية */
  #screen {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px;
    background: radial-gradient(ellipse at center, rgba(10,10,40,0.85), rgba(0,0,5,0.98));
    backdrop-filter: blur(4px);
  }
  #screen.hidden { display:none; }

  #title {
    font-size: clamp(48px, 9vw, 110px);
    font-weight: 200;
    letter-spacing: 0.18em;
    background: linear-gradient(135deg, #7ff2ff, #a26bff 45%, #ff5cc8 80%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(0, 224, 255, 0.6));
    animation: hueShift 8s linear infinite;
  }
  @keyframes hueShift {
    0% { filter: drop-shadow(0 0 30px rgba(0,224,255,0.6)) hue-rotate(0deg); }
    100% { filter: drop-shadow(0 0 30px rgba(255,92,200,0.6)) hue-rotate(60deg); }
  }

  #tagline {
    color:#88b8ff; font-size:14px; letter-spacing:0.5em;
    margin-top:6px; opacity:0.75; text-transform: uppercase;
  }

  #instructions {
    margin-top:34px; color:#aac8ff; font-size:15px;
    line-height:2; opacity:0.85; max-width:520px;
  }
  #instructions kbd {
    background:rgba(0,224,255,0.12); border:1px solid rgba(0,224,255,0.4);
    border-radius:5px; padding:2px 8px; color:#c8f8ff; font-family:inherit;
    margin:0 2px; font-size:13px;
  }

  #playBtn {
    margin-top:40px;
    padding:16px 52px;
    font-size:16px; letter-spacing:0.3em; text-transform:uppercase;
    color:#fff; background: transparent;
    border:1.5px solid transparent;
    border-radius:99px;
    position:relative; cursor:pointer;
    background-image: linear-gradient(#050510, #050510),
                      linear-gradient(135deg, #00e0ff, #a26bff, #ff5cc8);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 0 30px rgba(0, 224, 255, 0.35), inset 0 0 30px rgba(0, 224, 255, 0.08);
    transition:0.3s;
  }
  #playBtn:hover {
    box-shadow: 0 0 60px rgba(162,107,255,0.7), inset 0 0 40px rgba(162,107,255,0.15);
    transform: translateY(-2px);
  }

  .stats {
    margin-top:28px; color:#aac8ff; font-size:15px;
    line-height:2; letter-spacing:1px;
  }
  .stats span { color:#7ff2ff; font-weight:600; text-shadow:0 0 12px #00e0ff; }
  .stats .big { font-size:28px; color:#fff; display:block; margin-top:6px; text-shadow:0 0 24px #a26bff; }

  /* Flash أبيض لكامل الشاشة عند الأحداث الكبيرة */
  #flash {
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background:#fff; opacity:0; transition:opacity 0.4s ease-out;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="flash"></div>

<div id="hud">
  <div><span class="lbl">SCORE</span> &nbsp;<b id="uiScore">0</b></div>
  <div><span class="lbl">BEST</span> &nbsp;&nbsp;<b id="uiBest">0</b></div>
  <div><span class="lbl">LEVEL</span> &nbsp;<b id="uiLevel">1</b></div>
  <div><span class="lbl">SHARDS</span><b id="uiShards">0</b></div>
</div>

<div id="topLeft">
  <button id="pauseBtn">Pause</button>
</div>

<div id="energyWrap"><div id="energy"></div></div>

<div id="screen">
  <div id="title">AURORA</div>
  <div id="tagline">Neon Cosmos</div>
  <div id="instructions">
    حرّك المؤشر للطيران حول الكون.<br>
    اجمع شظايا الضوء <kbd>◆</kbd> وامتص الأعداء الصغار.<br>
    تجنّب الأشواك الحمراء <kbd>▲</kbd> والدوامات.<br>
    <kbd>SPACE</kbd> نبضة ضوئية · <kbd>P</kbd> إيقاف
  </div>
  <button id="playBtn">Begin</button>
</div>

<script>
(() => {
'use strict';

/* =========================================================
   إعداد
========================================================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

/* =========================================================
   أدوات
========================================================= */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const dist2 = (a, b) => { const dx = a.x-b.x, dy = a.y-b.y; return dx*dx+dy*dy; };

// تهيئة بذرة ألوان
let hueBase = 190; // سماوي مبدئي

/* =========================================================
   الصوت — نغمات محيطية
========================================================= */
let AC = null;
function initAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur=0.15, type='sine', vol=0.05, glide=0) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + glide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
// نبضة صوتية عند القفز/النمو
function chord(freqs, dur=0.4, vol=0.04) {
  freqs.forEach((f,i) => setTimeout(() => tone(f, dur, 'sine', vol), i*40));
}

/* =========================================================
   المدخلات
========================================================= */
const input = {
  mouse: { x: 0, y: 0 },
  keys: {},
  spacePressed: false,
  pointerActive: false
};
addEventListener('mousemove', e => {
  input.mouse.x = e.clientX;
  input.mouse.y = e.clientY;
  input.pointerActive = true;
});
addEventListener('mousedown', e => {
  if (e.button === 0) { input.spacePressed = true; onPulseClick(); }
  initAudio();
});
addEventListener('mouseup', () => input.spacePressed = false);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  input.keys[k] = true;
  if (k === ' ') {
    e.preventDefault();
    if (!input.spacePressed) onPulseClick();
    input.spacePressed = true;
  }
  if (k === 'p') togglePause();
  if (k === 'enter' && game.state === 'menu') startGame();
  initAudio();
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  input.keys[k] = false;
  if (k === ' ') input.spacePressed = false;
});

// لمس
addEventListener('touchstart', e => {
  if (e.touches[0]) {
    input.mouse.x = e.touches[0].clientX;
    input.mouse.y = e.touches[0].clientY;
    input.pointerActive = true;
    input.spacePressed = true;
    onPulseClick();
  }
  initAudio();
}, {passive:true});
addEventListener('touchmove', e => {
  if (e.touches[0]) {
    input.mouse.x = e.touches[0].clientX;
    input.mouse.y = e.touches[0].clientY;
  }
}, {passive:true});
addEventListener('touchend', () => input.spacePressed = false);

/* =========================================================
   تأثير Flash أبيض
========================================================= */
const flashEl = document.getElementById('flash');
let flashAmount = 0;
function doFlash(a = 0.5, decay = 0.02) {
  flashAmount = Math.max(flashAmount, a);
}

/* =========================================================
   حالة اللعبة
========================================================= */
const game = {
  state: 'menu', // menu | playing | paused | gameover
  time: 0,
  score: 0,
  level: 1,
  xp: 0,
  xpNext: 8,
  shardsCollected: 0,
  waveTimer: 0,
  spawnTimer: 0,
  difficulty: 1,
  best: parseInt(localStorage.getItem('aurora_best') || '0')
};
document.getElementById('uiBest').textContent = game.best;

/* =========================================================
   اللاعب
========================================================= */
const player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  r: 14,
  hp: 100, maxHp: 100,
  energy: 100, maxEnergy: 100,
  pulseCd: 0,
  invuln: 0,
  hue: 190,
  trail: [],
  maxTrail: 40,
  magnetRange: 120,
  pulsePower: 1
};

/* =========================================================
   الكون: نجوم + سدم
========================================================= */
const starLayers = [];
function initStars() {
  starLayers.length = 0;
  const layers = [
    { count: 160, speed: 0.15, size: 0.8, alpha: 0.5 },
    { count: 90, speed: 0.35, size: 1.3, alpha: 0.75 },
    { count: 40, speed: 0.7, size: 2.0, alpha: 1.0 }
  ];
  for (const L of layers) {
    const arr = [];
    for (let i = 0; i < L.count; i++) {
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: L.size * rand(0.6, 1.4),
        alpha: L.alpha * rand(0.6, 1),
        twinkle: rand(0.5, 2),
        hue: rand(180, 280)
      });
    }
    starLayers.push({ stars: arr, speed: L.speed });
  }
}

// سدم: كتل ضبابية كبيرة تتحرك ببطء
const nebulas = [];
function initNebulas() {
  nebulas.length = 0;
  for (let i = 0; i < 6; i++) {
    nebulas.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(180, 400),
      vx: rand(-0.15, 0.15),
      vy: rand(-0.15, 0.15),
      hue: rand(200, 320),
      alpha: rand(0.05, 0.12),
      phase: Math.random() * TAU
    });
  }
}

/* =========================================================
   الكيانات
========================================================= */
let shards = [];       // شظايا ضوء للجمع
let enemies = [];      // أعداء (مثلثات حمراء)
let swirls = [];       // دوامات
let particles = [];
let pulses = [];       // حلقات النبضة الضوئية
let floats = [];

/* =========================================================
   الشظايا (Shards)
========================================================= */
function spawnShard(x, y) {
  shards.push({
    x, y,
    vx: rand(-1.2, 1.2),
    vy: rand(-1.2, 1.2),
    r: 5,
    hue: rand(160, 200),
    phase: Math.random() * TAU,
    life: 500
  });
}

/* =========================================================
   الأعداء
========================================================= */
function spawnEnemy() {
  const pad = 60;
  const side = randi(0, 4);
  let x, y;
  if (side === 0) { x = rand(0, W); y = -pad; }
  else if (side === 1) { x = W + pad; y = rand(0, H); }
  else if (side === 2) { x = rand(0, W); y = H + pad; }
  else { x = -pad; y = rand(0, H); }

  const typeRoll = Math.random();
  let type = 'chaser';
  if (typeRoll < 0.55) type = 'chaser';
  else if (typeRoll < 0.8) type = 'drifter';
  else type = 'spinner';

  const hpBase = 18 + game.difficulty * 4;
  enemies.push({
    x, y,
    vx: 0, vy: 0,
    r: type === 'spinner' ? 12 : 14,
    hp: hpBase, maxHp: hpBase,
    type,
    angle: Math.random() * TAU,
    spin: rand(-0.08, 0.08),
    hue: type === 'chaser' ? 350 : type === 'drifter' ? 20 : 310,
    life: 0,
    speed: type === 'chaser' ? 1.6 : type === 'drifter' ? 1.0 : 1.3
  });
}

function spawnSwirl() {
  const x = rand(80, W - 80);
  const y = rand(80, H - 80);
  // لا تضعها فوق اللاعب مباشرة
  if (dist2({x,y}, player) < 250 * 250) return;
  swirls.push({
    x, y,
    r: 42,
    angle: 0,
    spin: rand(-0.04, 0.04),
    life: 900,
    hue: rand(260, 300)
  });
}

/* =========================================================
   الجزيئات
========================================================= */
function emit(x, y, count, opts = {}) {
  const {
    hue = 190, spread = 6, size = [1.5, 3.5],
    speed = [0.5, 5], life = [30, 60], curve = 0
  } = opts;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * TAU;
    const s = rand(speed[0], speed[1]);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: rand(life[0], life[1]),
      maxLife: life[1],
      size: rand(size[0], size[1]),
      hue: hue + rand(-20, 20),
      curve
    });
  }
}

/* =========================================================
   القوى والنبضات
========================================================= */
function onPulseClick() {
  if (game.state !== 'playing') return;
  if (player.pulseCd > 0) return;
  // ابحث عن أقرب عدو صغير
  let nearest = null, nd = Infinity;
  for (const e of enemies) {
    const d = dist2(e, player);
    if (d < nd) { nd = d; nearest = e; }
  }
  // نبضة ضوئية تدفع الأعداء
  pulses.push({
    x: player.x, y: player.y,
    r: 0, maxR: 180,
    life: 30, maxLife: 30,
    hue: player.hue
  });
  for (const e of enemies) {
    const d = Math.sqrt(dist2(e, player));
    if (d < 220) {
      const a = Math.atan2(e.y - player.y, e.x - player.x);
      const force = (1 - d / 220) * 9;
      e.vx += Math.cos(a) * force;
      e.vy += Math.sin(a) * force;
      // ضرر خفيف
      e.hp -= 4;
    }
  }
  player.pulseCd = 22;
  player.energy = Math.max(0, player.energy - 8);
  tone(320, 0.25, 'sine', 0.06, 400);
}

/* =========================================================
   إعادة الضبط
========================================================= */
function resetGame() {
  game.score = 0;
  game.level = 1;
  game.xp = 0;
  game.xpNext = 8;
  game.shardsCollected = 0;
  game.waveTimer = 60 * 15;
  game.spawnTimer = 30;
  game.difficulty = 1;
  game.time = 0;

  player.x = W / 2;
  player.y = H / 2;
  player.vx = 0; player.vy = 0;
  player.hp = 100; player.maxHp = 100;
  player.energy = 100; player.maxEnergy = 100;
  player.pulseCd = 0;
  player.invuln = 0;
  player.hue = 190;
  player.trail.length = 0;
  player.magnetRange = 120;
  player.pulsePower = 1;

  shards = []; enemies = []; swirls = [];
  particles = []; pulses = []; floats = [];

  // شظايا ابتدائية
  for (let i = 0; i < 10; i++) spawnShard(rand(80, W-80), rand(80, H-80));

  hueBase = 190;
}

/* =========================================================
   بدء/إيقاف
========================================================= */
const screenEl = document.getElementById('screen');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');

playBtn.addEventListener('click', () => { initAudio(); startGame(); });
pauseBtn.addEventListener('click', togglePause);

function startGame() {
  screenEl.classList.add('hidden');
  resetGame();
  game.state = 'playing';
  initStars();
  initNebulas();
  chord([392, 523, 659], 0.5, 0.03);
}

function togglePause() {
  if (game.state === 'playing') game.state = 'paused';
  else if (game.state === 'paused') game.state = 'playing';
}

function endGame() {
  game.state = 'gameover';
  if (game.score > game.best) {
    game.best = game.score;
    localStorage.setItem('aurora_best', game.best);
  }
  doFlash(0.7, 0.03);
  tone(200, 0.8, 'sine', 0.08, -150);

  screenEl.innerHTML = `
    <div id="title" style="font-size:clamp(38px,7vw,80px);">FIN</div>
    <div id="tagline">cosmic drift</div>
    <div class="stats">
      SCORE <span class="big">${game.score}</span>
      LEVEL <span>${game.level}</span>
      SHARDS <span>${game.shardsCollected}</span>
      BEST <span>${game.best}</span>
    </div>
    <button id="playBtn">Again</button>
  `;
  screenEl.classList.remove('hidden');
  document.getElementById('playBtn').addEventListener('click', startGame);
}

/* =========================================================
   التحديث
========================================================= */
function update(dt) {
  game.time += dt;
  hueBase = (190 + Math.sin(game.time * 0.005) * 40) % 360;
  player.hue = hueBase;

  // flash decay
  if (flashAmount > 0) {
    flashAmount -= 0.03 * dt;
    if (flashAmount < 0) flashAmount = 0;
    flashEl.style.opacity = flashAmount.toFixed(3);
  }

  if (game.state !== 'playing') return;

  /* --- النجوم --- */
  for (const layer of starLayers) {
    for (const s of layer.stars) {
      s.y += layer.speed * dt;
      if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
    }
  }

  /* --- سدم --- */
  for (const n of nebulas) {
    n.x += n.vx * dt;
    n.y += n.vy * dt;
    n.phase += 0.003 * dt;
    if (n.x < -n.r) n.x = W + n.r;
    if (n.x > W + n.r) n.x = -n.r;
    if (n.y < -n.r) n.y = H + n.r;
    if (n.y > H + n.r) n.y = -n.r;
  }

  /* --- اللاعب --- */
  // يتبع المؤشر بحركة مرنة (spring)
  const targetX = input.pointerActive ? input.mouse.x : W/2 + Math.cos(game.time*0.01)*100;
  const targetY = input.pointerActive ? input.mouse.y : H/2 + Math.sin(game.time*0.013)*80;
  const spring = 0.14;
  const damping = 0.82;
  player.vx += (targetX - player.x) * spring * dt;
  player.vy += (targetY - player.y) * spring * dt;
  player.vx *= Math.pow(damping, dt);
  player.vy *= Math.pow(damping, dt);
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, player.r, W - player.r);
  player.y = clamp(player.y, player.r, H - player.r);

  // trail
  player.trail.push({ x: player.x, y: player.y, hue: player.hue });
  if (player.trail.length > player.maxTrail) player.trail.shift();

  if (player.pulseCd > 0) player.pulseCd -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  player.energy = Math.min(player.maxEnergy, player.energy + 0.06 * dt);

  /* --- توليد --- */
  game.waveTimer -= dt;
  if (game.waveTimer <= 0) {
    game.waveTimer = 60 * 15;
    game.difficulty += 0.35;
    game.level++;
    // ولّد موجة شظايا
    for (let i = 0; i < 6; i++) spawnShard(rand(60, W-60), rand(60, H-60));
    chord([523, 659, 784], 0.5, 0.03);
    doFlash(0.15, 0.02);
    addFloat(player.x, player.y - 40, 'WAVE ' + game.level, '#7ff2ff');
  }

  game.spawnTimer -= dt;
  const maxEnemies = 6 + Math.floor(game.difficulty * 2);
  if (game.spawnTimer <= 0 && enemies.length < maxEnemies) {
    spawnEnemy();
    game.spawnTimer = Math.max(24, 90 - game.difficulty * 6);
  }

  // دوامات
  if (Math.random() < 0.0015 * game.difficulty && swirls.length < 3) {
    spawnSwirl();
  }

  /* --- حركة الشظايا --- */
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vx *= 0.985; s.vy *= 0.985;
    s.phase += 0.15 * dt;
    s.life -= dt;
    // انجذاب للمغناطيس
    const dx = player.x - s.x, dy = player.y - s.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < player.magnetRange * player.magnetRange) {
      const d = Math.sqrt(d2) || 1;
      const pull = (1 - d / player.magnetRange) * 0.9;
      s.vx += (dx / d) * pull * dt;
      s.vy += (dy / d) * pull * dt;
    }
    // اصطدام مع اللاعب
    if (d2 < (player.r + s.r + 6) ** 2) {
      game.score += 3;
      game.xp += 1;
      game.shardsCollected++;
      player.energy = Math.min(player.maxEnergy, player.energy + 2);
      emit(s.x, s.y, 10, { hue: s.hue, speed:[1, 3.5], life:[20, 40] });
      shards.splice(i, 1);
      tone(1200 + Math.random()*200, 0.08, 'sine', 0.03, 200);
      continue;
    }
    if (s.life <= 0) shards.splice(i, 1);
  }

  // إعادة توليد شظايا للحفاظ على حد أدنى
  if (shards.length < 6 && Math.random() < 0.02 * dt) {
    spawnShard(rand(60, W-60), rand(60, H-60));
  }

  /* --- الأعداء --- */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.life += dt;
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    e.angle = Math.atan2(dy, dx);

    if (e.type === 'chaser') {
      e.vx += (dx / d) * 0.14 * dt;
      e.vy += (dy / d) * 0.14 * dt;
    } else if (e.type === 'drifter') {
      // يدور ويقترب أحياناً
      e.vx += (dx / d) * 0.05 * dt + Math.cos(e.life * 0.05) * 0.08 * dt;
      e.vy += (dy / d) * 0.05 * dt + Math.sin(e.life * 0.05) * 0.08 * dt;
    } else if (e.type === 'spinner') {
      e.vx += (dx / d) * 0.08 * dt;
      e.vy += (dy / d) * 0.08 * dt;
      // حركة جانبية
      e.vx += Math.cos(e.angle + Math.PI/2) * 0.15 * dt;
      e.vy += Math.sin(e.angle + Math.PI/2) * 0.15 * dt;
    }

    e.vx *= Math.pow(0.9, dt);
    e.vy *= Math.pow(0.9, dt);
    e.x += e.vx * dt * e.speed;
    e.y += e.vy * dt * e.speed;

    // اصطدام مع اللاعب
    const d2p = dist2(e, player);
    if (d2p < (e.r + player.r) ** 2 && player.invuln <= 0) {
      player.hp -= 10 + game.difficulty * 2;
      player.invuln = 40;
      emit(player.x, player.y, 25, { hue: 350, speed:[2, 7], life:[20, 50] });
      tone(180, 0.3, 'sawtooth', 0.12, -80);
      doFlash(0.4, 0.02);
      // ارتداد
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      player.vx += Math.cos(a) * 8;
      player.vy += Math.sin(a) * 8;
    }

    if (e.hp <= 0) {
      game.score += 10;
      game.xp += 3;
      emit(e.x, e.y, 20, { hue: e.hue, speed:[1, 6], life:[30, 60] });
      tone(220 + Math.random()*100, 0.15, 'sawtooth', 0.05, 100);
      enemies.splice(i, 1);
      continue;
    }

    // بعيد جداً → أعده داخل الحدود
    if (e.x < -120 || e.x > W + 120 || e.y < -120 || e.y > H + 120) {
      if (e.life > 90) enemies.splice(i, 1);
    }
  }

  /* --- الدوامات --- */
  for (let i = swirls.length - 1; i >= 0; i--) {
    const s = swirls[i];
    s.angle += s.spin * dt;
    s.life -= dt;
    // انجذاب للاعب
    const dx = player.x - s.x, dy = player.y - s.y;
    const d2s = dx*dx + dy*dy;
    if (d2s < 180*180) {
      const d = Math.sqrt(d2s) || 1;
      const pull = (1 - d / 180) * 0.5;
      // يجذب اللاعب نحو المركز (خطر!)
      player.vx += (dx / d) * pull * dt * -1;
      player.vy += (dy / d) * pull * dt * -1;
    }
    // ضرر إذا لامس اللاعب
    if (d2s < (s.r + player.r) ** 2 && player.invuln <= 0) {
      player.hp -= 8;
      player.invuln = 30;
      emit(player.x, player.y, 15, { hue: 280, speed:[1, 5], life:[20, 40] });
      tone(280, 0.25, 'triangle', 0.08, -60);
    }
    if (s.life <= 0) swirls.splice(i, 1);
  }

  /* --- النبضات --- */
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.life -= dt;
    p.r = p.maxR * (1 - p.life / p.maxLife);
    if (p.life <= 0) pulses.splice(i, 1);
  }

  /* --- الجزيئات --- */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= Math.pow(0.94, dt);
    p.vy *= Math.pow(0.94, dt);
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  /* --- الأرقام الطائرة --- */
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.y -= 0.8 * dt;
    f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }

  /* --- XP و Level Up --- */
  while (game.xp >= game.xpNext) {
    game.xp -= game.xpNext;
    game.xpNext = Math.floor(game.xpNext * 1.35);
    player.maxHp += 10;
    player.hp = Math.min(player.maxHp, player.hp + 15);
    player.magnetRange += 8;
    player.pulsePower += 0.15;
    doFlash(0.25, 0.02);
    chord([523, 659, 784, 1047], 0.4, 0.035);
    emit(player.x, player.y, 40, { hue: 190, speed:[2, 9], life:[30, 70] });
    addFloat(player.x, player.y - 50, 'LEVEL UP', '#7ff2ff');
  }

  /* --- الموت --- */
  if (player.hp <= 0) {
    player.hp = 0;
    endGame();
  }

  /* --- HUD --- */
  document.getElementById('uiScore').textContent = game.score;
  document.getElementById('uiLevel').textContent = game.level;
  document.getElementById('uiShards').textContent = game.shardsCollected;
  document.getElementById('uiBest').textContent = game.best;
  document.getElementById('energy').style.width = (player.energy / player.maxEnergy * 100) + '%';
}

function addFloat(x, y, text, color = '#7ff2ff') {
  floats.push({ x, y, text, color, life: 60, maxLife: 60 });
}

/* =========================================================
   الرسم
========================================================= */
function draw() {
  // خلفية سوداء أساسية
  ctx.fillStyle = '#03030a';
  ctx.fillRect(0, 0, W, H);

  // سدم متحركة
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulas) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    const hue = (n.hue + Math.sin(n.phase) * 20) % 360;
    g.addColorStop(0, `hsla(${hue}, 80%, 55%, ${n.alpha})`);
    g.addColorStop(0.5, `hsla(${(hue+40)%360}, 80%, 40%, ${n.alpha*0.4})`);
    g.addColorStop(1, `hsla(${hue}, 80%, 30%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // نجوم متوازية
  for (const layer of starLayers) {
    for (const s of layer.stars) {
      const tw = 0.6 + 0.4 * Math.sin(game.time * 0.05 + s.twinkle * 10);
      ctx.fillStyle = `hsla(${s.hue}, 90%, 80%, ${s.alpha * tw})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, TAU);
      ctx.fill();
    }
  }

  /* ============ رسم عناصر اللعبة بـ lighter ============ */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // دوامات
  for (const s of swirls) {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    // حلقات متعددة
    for (let k = 0; k < 4; k++) {
      const rr = s.r * (0.4 + k * 0.2);
      ctx.strokeStyle = `hsla(${s.hue}, 90%, 60%, ${0.5 - k * 0.08})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, rr, k * 1.2, k * 1.2 + 4.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // الشظايا
  for (const s of shards) {
    const pulse = 0.7 + 0.3 * Math.sin(s.phase);
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
    g.addColorStop(0, `hsla(${s.hue}, 100%, 85%, 1)`);
    g.addColorStop(0.4, `hsla(${s.hue}, 100%, 65%, 0.5)`);
    g.addColorStop(1, `hsla(${s.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 4 * pulse, 0, TAU);
    ctx.fill();
    // نواة
    ctx.fillStyle = `hsl(${s.hue}, 100%, 90%)`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 0.6, 0, TAU);
    ctx.fill();
  }

  // ذيل اللاعب
  const trail = player.trail;
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const f = i / trail.length;
    const rr = player.r * f * 0.9;
    ctx.fillStyle = `hsla(${(t.hue + i * 2) % 360}, 100%, 70%, ${f * 0.35})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, rr, 0, TAU);
    ctx.fill();
  }

  // الأعداء
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    // هالة
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, e.r * 3);
    g.addColorStop(0, `hsla(${e.hue}, 100%, 60%, 0.7)`);
    g.addColorStop(1, `hsla(${e.hue}, 100%, 40%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 3, 0, TAU);
    ctx.fill();
    // جسم مثلث
    ctx.rotate(e.angle + Math.PI/2);
    ctx.fillStyle = `hsl(${e.hue}, 90%, 55%)`;
    ctx.beginPath();
    ctx.moveTo(0, -e.r);
    ctx.lineTo(e.r * 0.85, e.r * 0.7);
    ctx.lineTo(-e.r * 0.85, e.r * 0.7);
    ctx.closePath();
    ctx.fill();
    // قلب
    ctx.fillStyle = `hsl(${e.hue}, 100%, 85%)`;
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.35, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // الجزيئات
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, TAU);
    ctx.fill();
  }

  // النبضات
  for (const p of pulses) {
    const a = p.life / p.maxLife;
    ctx.strokeStyle = `hsla(${p.hue}, 100%, 80%, ${a * 0.9})`;
    ctx.lineWidth = 4 * a + 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, TAU);
    ctx.stroke();
  }

  // اللاعب
  drawPlayer();

  ctx.restore();

  /* ============ الأرقام الطائرة (بدون lighter) ============ */
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 16px "Segoe UI", sans-serif';
  for (const f of floats) {
    const a = f.life / f.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();

  // شاشة إيقاف
  if (game.state === 'paused') {
    ctx.fillStyle = 'rgba(3,3,15,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#7ff2ff';
    ctx.font = '200 64px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 30; ctx.shadowColor = '#7ff2ff';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = '300 16px "Segoe UI", sans-serif';
    ctx.fillStyle = '#88b8ff';
    ctx.fillText('press P to continue', W/2, H/2 + 40);
  }
}

function drawPlayer() {
  // هالة خارجية كبيرة
  const g = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 6);
  g.addColorStop(0, `hsla(${player.hue}, 100%, 90%, 0.95)`);
  g.addColorStop(0.2, `hsla(${player.hue}, 100%, 70%, 0.7)`);
  g.addColorStop(0.5, `hsla(${(player.hue+40)%360}, 100%, 60%, 0.35)`);
  g.addColorStop(1, `hsla(${player.hue}, 100%, 50%, 0)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r * 6, 0, TAU);
  ctx.fill();

  // حلقات مدارية
  const orbitR = player.r * 1.9;
  for (let i = 0; i < 3; i++) {
    const a = game.time * 0.03 * (i % 2 ? -1 : 1) + i * 2.1;
    const ox = player.x + Math.cos(a) * orbitR;
    const oy = player.y + Math.sin(a) * orbitR;
    const og = ctx.createRadialGradient(ox, oy, 0, ox, oy, 8);
    og.addColorStop(0, `hsla(${(player.hue + i * 40) % 360}, 100%, 85%, 1)`);
    og.addColorStop(1, `hsla(${(player.hue + i * 40) % 360}, 100%, 50%, 0)`);
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.arc(ox, oy, 8, 0, TAU);
    ctx.fill();
  }

  // نواة اللاعب
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r * 0.7, 0, TAU);
  ctx.fill();

  // حلقة بيضاء حول النواة
  ctx.strokeStyle = `hsla(${player.hue}, 100%, 90%, 0.9)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r * 1.2, 0, TAU);
  ctx.stroke();

  // حماية
  if (player.invuln > 0) {
    const a = player.invuln / 40;
    ctx.strokeStyle = `hsla(${(player.hue + 180) % 360}, 100%, 80%, ${a})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 2.5, 0, TAU);
    ctx.stroke();
  }
}

/* =========================================================
   الحلقة
========================================================= */
let lastT = performance.now();
function loop(now) {
  const dtMs = Math.min(48, now - lastT);
  lastT = now;
  const dt = dtMs / 16.6667;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// تهيئة سريعة للخلفية (قبل بدء اللعب)
initStars();
initNebulas();
// ضع اللاعب بالمنتصف من البداية ليراه اللاعب في الخلفية
player.x = innerWidth / 2;
player.y = innerHeight / 2;

})();
</script>
