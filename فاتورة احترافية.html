<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 مولد الفواتير | دعم الطباعة الحرارية و أحجام متعددة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
            background: #eef0f4;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12);
            overflow: hidden;
            min-height: 85vh;
        }

        @media (max-width: 850px) {
            .app-container {
                grid-template-columns: 1fr;
                min-height: auto;
            }
        }

        /* الشريط الجانبي للإعدادات */
        .sidebar {
            background: #f9fafc;
            padding: 25px 20px;
            border-left: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            max-height: 85vh;
        }

        .sidebar h3 {
            font-size: 1.2rem;
            color: #1e1e2f;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #5e5e7a;
            display: block;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e5ed;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            background: #fff;
            outline: none;
            transition: 0.2s;
            text-align: right;
            color: #1e1e2f;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #c0842c;
            box-shadow: 0 0 0 3px rgba(192,132,44,0.1);
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #1e1e2f;
            color: white;
            width: 100%;
        }
        .btn-primary:hover { background: #2d2d44; }

        .btn-outline {
            background: white;
            border: 1px solid #d0d5e0;
            color: #1e1e2f;
            flex: 1;
        }
        .btn-outline:hover { background: #f5f6fa; }

        .btn-remove-item {
            background: none;
            border: none;
            color: #c0392b;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
        }

        .items-list {
            background: #fff;
            border-radius: 14px;
            border: 1px solid #eef0f5;
            padding: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .item-entry {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .item-entry:last-child { border-bottom: none; }

        .item-entry input {
            border: none;
            background: transparent;
            padding: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }
        .item-desc { flex: 2; }
        .item-price { flex: 1; text-align: center; }
        .item-qty { flex: 0.8; text-align: center; }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* منطقة المعاينة */
        .preview-area {
            background: #f1f3f6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .paper {
            background: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin: 15px auto;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* أحجام الورق */
        .size-A4 { width: 210mm; min-height: 297mm; }
        .size-A5 { width: 148mm; min-height: 210mm; }
        .size-A6 { width: 105mm; min-height: 148mm; }
        .size-thermal { width: 80mm; min-height: auto; }

        @media screen and (max-width: 850px) {
            .size-A4 { width: 100%; }
            .size-A5 { width: 90%; }
            .size-A6 { width: 70%; }
            .size-thermal { width: 80%; }
        }

        .invoice-content {
            padding: 15mm 12mm;
            font-family: 'Cairo', sans-serif;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        .thermal .invoice-content {
            padding: 4mm 3mm;
            font-size: 11px;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6mm;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 4mm;
        }
        .store-name { font-size: 1.6em; font-weight: bold; color: #b87c2c; }
        .thermal .store-name { font-size: 1.3em; }

        .invoice-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6mm;
            font-size: 0.9em;
            color: #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 5mm 0;
        }
        th {
            background: #f0f0f0;
            padding: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 0.8em;
            border-bottom: 1px solid #ccc;
        }
        td {
            padding: 5px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-size: 0.85em;
        }
        .thermal table th, .thermal table td { padding: 3px; font-size: 10px; }

        .total-line {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 5mm;
            font-size: 1.2em;
            border-top: 2px solid #333;
            padding-top: 3mm;
        }
        .thermal .total-line { font-size: 1em; }

        .note-text {
            margin-top: 6mm;
            font-size: 0.8em;
            color: #5a5a5a;
            text-align: center;
            border-top: 1px dashed #ddd;
            padding-top: 3mm;
        }

        .placeholder-hint {
            color: #aaa;
            font-style: italic;
        }

        @media print {
            body { background: white; }
            .app-container { grid-template-columns: 1fr; box-shadow: none; }
            .sidebar { display: none; }
            .preview-area { padding: 0; background: white; }
            .paper { box-shadow: none; margin: 0 auto; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- الشريط الجانبي -->
    <div class="sidebar">
        <h3>⚙️ إعدادات الفاتورة</h3>

        <div class="form-group">
            <label>🏪 اسم المكتبة</label>
            <input type="text" id="storeName" placeholder="أدخل اسم المكتبة" oninput="liveUpdate()">
        </div>
        <div class="row-2">
            <div class="form-group">
                <label>📍 العنوان</label>
                <input type="text" id="storeAddress" placeholder="العنوان" oninput="liveUpdate()">
            </div>
            <div class="form-group">
                <label>📞 الهاتف</label>
                <input type="text" id="storePhone" placeholder="رقم الهاتف" oninput="liveUpdate()">
            </div>
        </div>
        <div class="form-group">
            <label>👤 اسم العميل (اختياري)</label>
            <input type="text" id="customerName" placeholder="اتركه فارغاً إن لم يوجد" oninput="liveUpdate()">
        </div>
        <div class="form-group">
            <label>📝 ملاحظة</label>
            <textarea id="invoiceNote" rows="2" placeholder="ملاحظة تظهر أسفل الفاتورة" oninput="liveUpdate()"></textarea>
        </div>

        <h3 style="margin-top: 10px;">📦 المواد</h3>
        <div class="items-list" id="itemsContainer">
            <!-- يتم إنشاء العناصر ديناميكياً -->
        </div>
        <button class="btn btn-outline" onclick="addNewItem()" style="width:100%;">➕ إضافة مادة</button>

        <h3 style="margin-top: 10px;">📐 إعدادات الطباعة</h3>
        <div class="form-group">
            <label>حجم الورق</label>
            <select id="paperSize" onchange="changePaperSize()">
                <option value="A4">A4 (افتراضي)</option>
                <option value="A5">A5 - نصف ورقة</option>
                <option value="A6">A6 - ربع ورقة</option>
                <option value="thermal">🖨️ طابعة حرارية (80mm)</option>
            </select>
        </div>

        <div class="action-row">
            <button class="btn btn-primary" onclick="printInvoice()">🖨️ طباعة</button>
            <button class="btn btn-outline" onclick="exportAsImage()">📸 صورة</button>
        </div>
        <p style="font-size:0.7rem; color:#888; text-align:center;">يدعم البلوتوث الحراري عبر خيار الحجم المناسب</p>
    </div>

    <!-- المعاينة -->
    <div class="preview-area" id="previewArea">
        <div class="paper size-A4" id="paperElement">
            <div class="invoice-content" id="invoiceDisplay">
                <!-- المحتوى الديناميكي -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    let itemsData = [];

    window.onload = function() {
        // إضافة صفين فارغين افتراضياً
        addNewItem(true);
        addNewItem(true);
        liveUpdate();
    };

    function addNewItem(silent = false) {
        const container = document.getElementById('itemsContainer');
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item-entry';
        itemDiv.innerHTML = `
            <input type="text" class="item-desc" placeholder="المادة" oninput="liveUpdate()">
            <input type="number" class="item-price" placeholder="سعر" value="" min="0" step="0.01" oninput="liveUpdate()">
            <input type="number" class="item-qty" placeholder="عدد" value="" min="1" step="1" oninput="liveUpdate()">
            <button class="btn-remove-item" onclick="removeItem(this)">✕</button>
        `;
        container.appendChild(itemDiv);
        if (!silent) liveUpdate();
    }

    function removeItem(btn) {
        const entry = btn.closest('.item-entry');
        if (entry) {
            entry.remove();
            liveUpdate();
        }
    }

    function gatherItems() {
        const entries = document.querySelectorAll('.item-entry');
        const items = [];
        entries.forEach((entry, idx) => {
            const desc = entry.querySelector('.item-desc').value.trim();
            const price = parseFloat(entry.querySelector('.item-price').value) || 0;
            const qty = parseInt(entry.querySelector('.item-qty').value) || 0;
            if (desc !== '' || price > 0 || qty > 0) {
                items.push({
                    number: idx + 1,
                    desc: desc || '—',
                    price: price,
                    qty: qty,
                    total: price * qty
                });
            }
        });
        return items;
    }

    function liveUpdate() {
        const store = document.getElementById('storeName').value || 'اسم المكتبة';
        const addr = document.getElementById('storeAddress').value || '';
        const phone = document.getElementById('storePhone').value || '';
        const customer = document.getElementById('customerName').value || '';
        const note = document.getElementById('invoiceNote').value || '';
        const items = gatherItems();
        const grandTotal = items.reduce((sum, i) => sum + i.total, 0);

        let html = `
            <div class="invoice-header">
                <div class="store-name">📚 ${store}</div>
                <div style="text-align:left;"><strong>فاتورة</strong></div>
            </div>
            <div class="invoice-meta">
                <div>${addr ? '📍 ' + addr : ''} ${phone ? '| 📞 ' + phone : ''}</div>
                <div>${customer ? '👤 ' + customer : ''}</div>
            </div>
        `;

        if (items.length > 0) {
            html += `<table><thead><tr><th>#</th><th>المادة</th><th>السعر</th><th>العدد</th><th>المجموع</th></tr></thead><tbody>`;
            items.forEach(item => {
                html += `<tr>
                    <td>${item.number}</td>
                    <td style="text-align:right;">${item.desc}</td>
                    <td>${item.price.toLocaleString()}</td>
                    <td>${item.qty}</td>
                    <td><strong>${item.total.toLocaleString()}</strong></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            html += `<div class="total-line"><span>المجموع الكلي</span><span>${grandTotal.toLocaleString()} د.ع</span></div>`;
        } else {
            html += `<p style="text-align:center; color:#aaa; margin:20px;">لا توجد مواد مضافة</p>`;
        }

        if (note) {
            html += `<div class="note-text">📌 ${note}</div>`;
        }

        document.getElementById('invoiceDisplay').innerHTML = html;
    }

    function changePaperSize() {
        const paper = document.getElementById('paperElement');
        const size = document.getElementById('paperSize').value;
        paper.className = 'paper'; // إعادة تعيين
        switch(size) {
            case 'A4': paper.classList.add('size-A4'); break;
            case 'A5': paper.classList.add('size-A5'); break;
            case 'A6': paper.classList.add('size-A6'); break;
            case 'thermal': paper.classList.add('size-thermal', 'thermal'); break;
        }
    }

    function printInvoice() {
        liveUpdate();
        window.print();
    }

    function exportAsImage() {
        liveUpdate();
        const element = document.getElementById('paperElement');
        html2canvas(element, {
            backgroundColor: '#ffffff',
            scale: 2,
            allowTaint: false,
            useCORS: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `فاتورة-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }).catch(() => alert('تعذر التصدير، تحقق من الاتصال'));
    }
</script>
</body>
</html>
