<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أداة تجهيز الصور الاحترافية | المبرمج أ. احمد حسن</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- مكتبة Cropper.js للاقتصاص -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
            overflow-x: hidden; 
            overflow-y: auto; 
            margin: 0;
            padding: 0;
        }
        
        .render-zone {
            position: fixed;
            top: -20000px;
            left: -20000px;
            z-index: -9999;
            pointer-events: none;
        }
        
        /* تم التعديل لتبدأ الصور من الأعلى */
        .print-page {
            background: white;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            box-sizing: border-box;
            overflow: hidden; 
        }
        
        .photo-cell {
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
            outline: 1px dashed rgba(203, 213, 225, 0.5); 
        }

        .modal-overlay {
            backdrop-filter: blur(5px);
        }

        .cropper-container {
            max-height: 100%;
        }

        /* تنسيق شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col min-h-[100dvh] w-full">

    <div class="bg-slate-900 w-full px-6 py-4 shadow-md z-10 flex-shrink-0">
        <h1 class="text-xl md:text-2xl font-extrabold text-white text-center tracking-wide">مجهّز صور الطباعة الذكي</h1>
    </div>

    <div class="flex-1 w-full max-w-2xl mx-auto flex flex-col justify-evenly p-6 md:p-8 z-0 gap-6">
        
        <div class="space-y-4">
            <div class="space-y-2">
                <label class="block text-sm font-bold text-slate-700">إضافة الصور للورقة (يمكنك رفع أكثر من صورة)</label>
                <label id="uploadLabel" class="flex flex-col items-center justify-center w-full h-16 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-slate-400 transition-all">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        <span id="uploadText" class="text-xs md:text-sm font-bold text-slate-600">اضغط لرفع وإضافة صورة</span>
                    </div>
                    <input id="imageInput" type="file" accept="image/*" class="hidden" />
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-700">مقاس الورقة الأساسي</label>
                    <select id="paperSize" class="w-full h-14 px-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-slate-800 outline-none font-bold text-slate-800 text-[13px] md:text-sm transition-all appearance-none text-center cursor-pointer">
                        <option value="a1" data-w="594" data-h="841">A1 (59.4 × 84.1 سم)</option>
                        <option value="a2" data-w="420" data-h="594">A2 (42 × 59.4 سم)</option>
                        <option value="a3" data-w="297" data-h="420">A3 (29.7 × 42 سم)</option>
                        <option value="a4" data-w="210" data-h="297" selected>A4 (الافتراضي)</option>
                        <option value="a5" data-w="148" data-h="210">A5 (14.8 × 21 سم)</option>
                        <option value="a6" data-w="105" data-h="148">A6 (10.5 × 14.8 سم)</option>
                        <option value="a7" data-w="74" data-h="105">A7 (7.4 × 10.5 سم)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-700">اتجاه الورقة</label>
                    <select id="orientation" class="w-full h-14 px-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-slate-800 outline-none font-bold text-slate-800 text-[13px] md:text-sm transition-all appearance-none text-center cursor-pointer">
                        <option value="p" selected>عمودي (Portrait)</option>
                        <option value="l">أفقي (Landscape)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 md:gap-6 bg-slate-50 p-4 md:p-6 rounded-3xl border border-slate-100">
            <!-- قائمة الصور المضافة -->
            <div class="col-span-2 border-b border-slate-200 pb-4">
                <label class="block text-sm font-bold text-slate-700 mb-3">الصور المضافة للطباعة</label>
                <div id="imagesList" class="flex flex-col gap-2 max-h-48 overflow-y-auto pl-2">
                    <!-- سيتم إضافة الصور هنا -->
                </div>
            </div>

            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">العرض (سم)</label>
                <input type="number" id="widthInput" value="15" min="1" step="0.1" class="w-full px-3 py-2.5 md:py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-extrabold text-slate-800 text-lg shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الارتفاع (سم)</label>
                <input type="number" id="heightInput" value="15" min="1" step="0.1" class="w-full px-3 py-2.5 md:py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-extrabold text-slate-800 text-lg shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الفراغ (ملم)</label>
                <input type="number" id="gapInput" value="0" min="0" step="0.5" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-bold text-slate-800 shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الهوامش (ملم)</label>
                <input type="number" id="marginInput" value="0" min="0" step="1" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-bold text-slate-800 shadow-sm">
            </div>
        </div>

        <div class="space-y-3 pb-4">
            <button id="previewBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                معاينة الورقة قبل الحفظ
            </button>
            
            <div class="flex gap-3">
                <button id="downloadPDF" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-xs md:text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    حفظ المستند PDF
                </button>
                <button id="downloadJPG" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-xs md:text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    صورة مقصوصة
                </button>
            </div>
        </div>
    </div>

    <!-- نوافذ منبثقة (Modal) -->
    <div id="cropperModal" class="hidden fixed inset-0 z-[60] bg-slate-900/95 modal-overlay flex flex-col items-center justify-center p-4">
        <h2 class="text-white font-bold mb-4 text-xl">اقتصاص الصورة</h2>
        <div class="w-full max-w-3xl h-[60vh] bg-slate-800 rounded-lg overflow-hidden relative flex justify-center items-center">
            <img id="cropperImage" src="" class="max-w-full max-h-full block" alt="صورة للاقتصاص">
        </div>
        <div class="flex gap-4 mt-6 w-full max-w-xl justify-center">
            <button id="cropCancelBtn" class="flex-1 bg-slate-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-xl transition-all">إلغاء</button>
            <button id="cropSaveBtn" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl transition-all">اعتماد وإضافة</button>
        </div>
    </div>

    <div id="previewModal" class="hidden fixed inset-0 z-50 bg-slate-900/90 modal-overlay flex flex-col items-center justify-center p-4">
        <button id="closeModalBtn" class="absolute top-6 right-6 bg-white/20 hover:bg-red-500 text-white rounded-full p-2 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <span id="modalPaperLabel" class="text-white font-bold mb-4 bg-slate-800 px-4 py-1 rounded-full text-sm shadow-md">معاينة ورقة كاملة</span>
        <img id="modalImg" class="max-h-[80vh] max-w-full object-contain rounded-md shadow-2xl bg-white" src="" alt="المعاينة غير متاحة" />
    </div>

    <div class="render-zone">
        <div id="printPage" class="print-page">
            <div id="gridContainer"></div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadLabel = document.getElementById('uploadLabel');
        const paperSizeSelect = document.getElementById('paperSize');
        const orientationSelect = document.getElementById('orientation');
        const gridContainer = document.getElementById('gridContainer');
        const printPage = document.getElementById('printPage');
        
        const previewModal = document.getElementById('previewModal');
        const modalImg = document.getElementById('modalImg');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalPaperLabel = document.getElementById('modalPaperLabel');

        let cropper = null;
        const cropperModal = document.getElementById('cropperModal');
        const cropperImage = document.getElementById('cropperImage');
        const cropSaveBtn = document.getElementById('cropSaveBtn');
        const cropCancelBtn = document.getElementById('cropCancelBtn');

        // مصفوفة لتخزين الصور المضافة وإعداداتها
        let uploadedImages = [];

        // تحديث وعرض قائمة الصور المضافة
        function renderImagesList() {
            const container = document.getElementById('imagesList');
            if(uploadedImages.length === 0) {
                container.innerHTML = '<div class="text-xs font-bold text-slate-400 text-center py-4 border-2 border-dashed border-slate-200 rounded-xl">لم يتم إضافة صور بعد</div>';
                uploadLabel.classList.remove("border-emerald-500", "bg-emerald-50");
                return;
            }

            uploadLabel.classList.add("border-emerald-500", "bg-emerald-50");
            container.innerHTML = '';
            
            uploadedImages.forEach((img, index) => {
                container.innerHTML += `
                    <div class="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                        <img src="${img.src}" class="w-14 h-14 object-cover rounded-lg border border-slate-200" />
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-slate-500">عدد النسخ المطلوبة</label>
                            <input type="number" min="1" placeholder="اتركه فارغاً لملء الباقي" value="${img.count}" onchange="updateImageCount(${index}, this.value)" class="w-full text-sm font-bold border-b-2 border-slate-200 focus:border-indigo-600 outline-none px-1 py-1">
                        </div>
                        <button onclick="removeImage(${index})" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white p-2.5 rounded-lg transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
            });
        }

        window.updateImageCount = (idx, val) => {
            uploadedImages[idx].count = val;
        };

        window.removeImage = (idx) => {
            uploadedImages.splice(idx, 1);
            renderImagesList();
        };

        // تهيئة مبدئية
        renderImagesList();

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                cropperImage.src = event.target.result;
                cropperModal.classList.remove('hidden');
                
                if (cropper) cropper.destroy();
                cropper = new Cropper(cropperImage, {
                    viewMode: 1,
                    autoCropArea: 0.8,
                    responsive: true,
                    background: false
                });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        cropSaveBtn.addEventListener('click', () => {
            if (!cropper) return;
            
            const canvas = cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });
            
            // إضافة الصورة الجديدة للمصفوفة بقيمة افتراضية (1)
            uploadedImages.push({
                src: canvas.toDataURL('image/jpeg', 1.0),
                count: "1" 
            });
            
            renderImagesList();
            cropperModal.classList.add('hidden');
            cropper.destroy();
            cropper = null;
        });

        cropCancelBtn.addEventListener('click', () => {
            cropperModal.classList.add('hidden');
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        });

        function getPaperDims() {
            const option = paperSizeSelect.options[paperSizeSelect.selectedIndex];
            const orient = orientationSelect.value;
            let w = parseFloat(option.getAttribute('data-w'));
            let h = parseFloat(option.getAttribute('data-h'));
            
            if (orient === 'l') {
                return { id: option.value, orient: 'l', name: option.text.split('(')[0].trim() + ' (أفقي)', w: h, h: w };
            } else {
                return { id: option.value, orient: 'p', name: option.text.split('(')[0].trim() + ' (عمودي)', w: w, h: h };
            }
        }

        // دالة تقوم بتحويل إعدادات المستخدم إلى قائمة خطية للصور المراد رسمها
        function getRenderList(maxCapacity) {
            let list = [];
            for (let i = 0; i < uploadedImages.length; i++) {
                let count = parseInt(uploadedImages[i].count);
                // إذا كان الحقل فارغاً أو صفر، اعتبره طالباً لملء بقية الورقة
                if (isNaN(count) || count <= 0) {
                    count = maxCapacity - list.length;
                }
                for (let j = 0; j < count; j++) {
                    if (list.length >= maxCapacity) break;
                    list.push(uploadedImages[i].src);
                }
                if (list.length >= maxCapacity) break;
            }
            return list;
        }

        function buildGrid() {
            gridContainer.innerHTML = "";
            const paper = getPaperDims();

            const marginMm = parseFloat(document.getElementById('marginInput').value) || 0; 
            printPage.style.width = `${paper.w}mm`;
            printPage.style.height = `${paper.h}mm`;
            printPage.style.padding = `${marginMm}mm`;

            const imgWidthCm = parseFloat(document.getElementById('widthInput').value) || 15;
            const imgHeightCm = parseFloat(document.getElementById('heightInput').value) || 15;
            const gapMm = parseFloat(document.getElementById('gapInput').value) || 0; 

            // استخدام Flex للترتيب من الأعلى بطريقة انسيابية ومن اليمين لليسار حسب اتجاه الصفحة
            gridContainer.style.display = 'flex';
            gridContainer.style.flexWrap = 'wrap';
            gridContainer.style.alignContent = 'flex-start'; // الترتيب يبدأ من الأعلى
            gridContainer.style.gap = `${gapMm}mm`;
            gridContainer.style.width = '100%';

            const imgWidthMm = imgWidthCm * 10;
            const imgHeightMm = imgHeightCm * 10;
            const availableW = paper.w - (marginMm * 2);
            const availableH = paper.h - (marginMm * 2);

            const tolerance = 8; 
            const maxCols = Math.floor((availableW + gapMm + tolerance) / (imgWidthMm + gapMm));
            const maxRows = Math.floor((availableH + gapMm + tolerance) / (imgHeightMm + gapMm));

            if (maxCols <= 0 || maxRows <= 0) return;
            const maxCapacity = maxCols * maxRows;

            const renderList = getRenderList(maxCapacity);

            for (let i = 0; i < renderList.length; i++) {
                const cell = document.createElement('div');
                cell.className = 'photo-cell';
                cell.style.width = `${imgWidthCm}cm`;
                cell.style.height = `${imgHeightCm}cm`;
                cell.style.backgroundImage = `url(${renderList[i]})`;
                gridContainer.appendChild(cell);
            }
        }

        const preloadAndProcessImage = (src, wCm, hCm) => {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = wCm * 118.11; 
                    canvas.height = hCm * 118.11;
                    const ctx = canvas.getContext('2d');
                    const imgRatio = img.width / img.height;
                    const targetRatio = canvas.width / canvas.height;
                    let sx, sy, sw, sh;
                    if (imgRatio > targetRatio) {
                        sh = img.height; sw = img.height * targetRatio; sx = (img.width - sw) / 2; sy = 0;
                    } else {
                        sw = img.width; sh = img.width / targetRatio; sx = 0; sy = (img.height - sh) / 2;
                    }
                    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 1.0));
                };
                img.src = src;
            });
        };

        document.getElementById('previewBtn').addEventListener('click', async () => {
            if (uploadedImages.length === 0) return alert("يرجى إضافة صورة واحدة على الأقل للمعاينة!");
            
            buildGrid(); 
            const paper = getPaperDims();
            modalPaperLabel.innerText = `شكل الطباعة على ${paper.name}`;
            
            await new Promise(r => setTimeout(r, 50));
            html2canvas(printPage, { scale: 1.5, useCORS: true }).then(canvas => {
                modalImg.src = canvas.toDataURL('image/jpeg', 0.9);
                previewModal.classList.remove('hidden'); 
            });
        });

        closeModalBtn.addEventListener('click', () => {
            previewModal.classList.add('hidden');
            modalImg.src = "";
        });

        document.getElementById('downloadJPG').addEventListener('click', async () => {
            if (uploadedImages.length === 0) return alert("يرجى إضافة صورة واحدة على الأقل!");
            
            buildGrid();
            await new Promise(r => setTimeout(r, 100));

            html2canvas(gridContainer, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `تصميم_مقصوص_${document.getElementById('widthInput').value}سم.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            });
        });

        document.getElementById('downloadPDF').addEventListener('click', async () => {
            if (uploadedImages.length === 0) return alert("يرجى إضافة صورة واحدة على الأقل!");
            
            const paper = getPaperDims();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF(paper.orient, 'mm', paper.id); 

            const imgWidthCm = parseFloat(document.getElementById('widthInput').value) || 15;
            const imgHeightCm = parseFloat(document.getElementById('heightInput').value) || 15;
            const gapMm = parseFloat(document.getElementById('gapInput').value) || 0;
            const marginMm = parseFloat(document.getElementById('marginInput').value) || 0;

            const imgWidthMm = imgWidthCm * 10;
            const imgHeightMm = imgHeightCm * 10;
            const availableW = paper.w - (marginMm * 2);
            const availableH = paper.h - (marginMm * 2);

            const tolerance = 8;
            const maxCols = Math.floor((availableW + gapMm + tolerance) / (imgWidthMm + gapMm));
            const maxRows = Math.floor((availableH + gapMm + tolerance) / (imgHeightMm + gapMm));

            if (maxCols <= 0 || maxRows <= 0) return alert("حجم الصورة أكبر من الورقة!");

            const maxCapacity = maxCols * maxRows;
            const renderList = getRenderList(maxCapacity);
            if (renderList.length === 0) return;

            // تجهيز ومعالجة دقة جميع الصور المطلوبة مسبقاً
            const uniqueSrcs = [...new Set(renderList)];
            const processedCache = {};
            for(let src of uniqueSrcs) {
                processedCache[src] = await preloadAndProcessImage(src, imgWidthCm, imgHeightCm);
            }

            // حساب الإحداثيات لتبدأ من الأعلى واليمين (لاتجاه اللغة العربية)
            let startX = paper.w - marginMm - imgWidthMm; 
            let startY = marginMm; 
            
            let x = startX;
            let y = startY;
            let col = 0;

            for (let i = 0; i < renderList.length; i++) {
                const src = renderList[i];
                const processedSrc = processedCache[src];

                doc.addImage(processedSrc, 'JPEG', x, y, imgWidthMm, imgHeightMm, undefined, 'FAST');
                doc.setDrawColor(210, 215, 223);
                doc.setLineWidth(0.1);
                doc.rect(x, y, imgWidthMm, imgHeightMm);

                col++;
                if (col >= maxCols) {
                    col = 0;
                    x = startX;
                    y += imgHeightMm + gapMm;
                } else {
                    x -= (imgWidthMm + gapMm);
                }
            }
            
            doc.save(`طباعة_${paper.id}_${paper.orient === 'l' ? 'أفقي' : 'عمودي'}_${imgWidthCm}x${imgHeightCm}سم.pdf`);
        });
    </script>
</body>
</html>
