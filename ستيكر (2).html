<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أداة تجهيز الصور الاحترافية | المبرمج أ. احمد حسن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
            /* منع السكرول الأفقي فقط، والسماح بالعمودي للشاشات الصغيرة */
            overflow-x: hidden; 
            overflow-y: auto; 
            margin: 0;
            padding: 0;
        }
        
        /* منطقة المعالجة المخفية */
        .render-zone {
            position: fixed;
            top: -20000px;
            left: -20000px;
            z-index: -9999;
            pointer-events: none;
        }
        
        .print-page {
            background: white;
            display: flex;
            justify-content: center;
        }
        .grid-container {
            display: grid;
            align-content: start;
        }
        .photo-cell {
            background-size: cover;
            background-position: center;
            box-sizing: border-box;
            outline: 1px dashed rgba(203, 213, 225, 0.5); /* خطوط قص خفيفة */
        }

        /* نافذة المعاينة المنبثقة */
        .modal-overlay {
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="flex flex-col min-h-[100dvh] w-full">

    <div class="bg-slate-900 w-full px-6 py-4 shadow-md z-10 flex-shrink-0">
        <h1 class="text-xl md:text-2xl font-extrabold text-white text-center tracking-wide">مجهّز صور الطباعة الذكي</h1>
    </div>

    <div class="flex-1 w-full max-w-2xl mx-auto flex flex-col justify-evenly p-6 md:p-8 z-0 gap-6">
        
        <div class="space-y-4">
            <div class="space-y-2">
                <label class="block text-sm font-bold text-slate-700">الصورة المراد تكرارها</label>
                <label class="flex flex-col items-center justify-center w-full h-16 border-2 border-slate-300 border-dashed rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-slate-400 transition-all">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <span id="uploadText" class="text-xs md:text-sm font-bold text-slate-600">اضغط لرفع الصورة</span>
                    </div>
                    <input id="imageInput" type="file" accept="image/*" class="hidden" />
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-700">مقاس الورقة الأساسي</label>
                    <select id="paperSize" class="w-full h-14 px-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-slate-800 outline-none font-bold text-slate-800 text-[13px] md:text-sm transition-all appearance-none text-center cursor-pointer">
                        <option value="a1" data-w="594" data-h="841">A1 (59.4 × 84.1 سم)</option>
                        <option value="a2" data-w="420" data-h="594">A2 (42 × 59.4 سم)</option>
                        <option value="a3" data-w="297" data-h="420">A3 (29.7 × 42 سم)</option>
                        <option value="a4" data-w="210" data-h="297" selected>A4 (الافتراضي)</option>
                        <option value="a5" data-w="148" data-h="210">A5 (14.8 × 21 سم)</option>
                        <option value="a6" data-w="105" data-h="148">A6 (10.5 × 14.8 سم)</option>
                        <option value="a7" data-w="74" data-h="105">A7 (7.4 × 10.5 سم)</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="block text-sm font-bold text-slate-700">اتجاه الورقة</label>
                    <select id="orientation" class="w-full h-14 px-4 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:bg-white focus:border-slate-800 outline-none font-bold text-slate-800 text-[13px] md:text-sm transition-all appearance-none text-center cursor-pointer">
                        <option value="p" selected>عمودي (Portrait)</option>
                        <option value="l">أفقي (Landscape)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 md:gap-6 bg-slate-50 p-4 md:p-6 rounded-3xl border border-slate-100">
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">العرض (سم)</label>
                <input type="number" id="widthInput" value="5" min="1" step="0.1" class="w-full px-3 py-2.5 md:py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-extrabold text-slate-800 text-lg shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الارتفاع (سم)</label>
                <input type="number" id="heightInput" value="5" min="1" step="0.1" class="w-full px-3 py-2.5 md:py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-extrabold text-slate-800 text-lg shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الفراغ (ملم)</label>
                <input type="number" id="gapInput" value="1" min="0" step="0.5" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-bold text-slate-800 shadow-sm">
            </div>
            <div class="space-y-2 text-center">
                <label class="block text-xs md:text-sm font-bold text-slate-500">الهوامش (ملم)</label>
                <input type="number" id="marginInput" value="0" min="0" step="1" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-slate-800 outline-none text-center font-bold text-slate-800 shadow-sm">
            </div>
        </div>

        <div class="space-y-3 pb-4">
            <button id="previewBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                معاينة الورقة قبل الحفظ
            </button>
            
            <div class="flex gap-3">
                <button id="downloadPDF" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-xs md:text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    حفظ المستند PDF
                </button>
                <button id="downloadJPG" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-xs md:text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    صورة مقصوصة
                </button>
            </div>
        </div>
    </div>

    <div class="mt-auto w-full py-3 bg-slate-50 border-t border-slate-200 text-center flex-shrink-0">
        <span class="text-xs font-bold text-slate-500 tracking-wide">
            برمجة وتطوير: أ. احمد حسن
        </span>
    </div>

    <div id="previewModal" class="hidden fixed inset-0 z-50 bg-slate-900/90 modal-overlay flex flex-col items-center justify-center p-4">
        <button id="closeModalBtn" class="absolute top-6 right-6 bg-white/20 hover:bg-red-500 text-white rounded-full p-2 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <span id="modalPaperLabel" class="text-white font-bold mb-4 bg-slate-800 px-4 py-1 rounded-full text-sm shadow-md">معاينة ورقة كاملة</span>
        <img id="modalImg" class="max-h-[80vh] max-w-full object-contain rounded-md shadow-2xl bg-white" src="" alt="المعاينة غير متاحة" />
    </div>

    <div class="render-zone">
        <div id="printPage" class="print-page">
            <div id="gridContainer" class="grid-container"></div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadText = document.getElementById('uploadText');
        const paperSizeSelect = document.getElementById('paperSize');
        const orientationSelect = document.getElementById('orientation');
        const gridContainer = document.getElementById('gridContainer');
        const printPage = document.getElementById('printPage');
        
        const previewModal = document.getElementById('previewModal');
        const modalImg = document.getElementById('modalImg');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalPaperLabel = document.getElementById('modalPaperLabel');

        let originalImageSrc = "";

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            uploadText.innerText = "تم الإدراج بنجاح";
            uploadText.classList.replace("text-slate-600", "text-emerald-600");
            imageInput.parentElement.classList.add("border-emerald-500", "bg-emerald-50");
            
            const reader = new FileReader();
            reader.onload = (event) => originalImageSrc = event.target.result;
            reader.readAsDataURL(file);
        });

        // دالة إحضار الأبعاد مع مراعاة الاتجاه (عمودي/أفقي)
        function getPaperDims() {
            const option = paperSizeSelect.options[paperSizeSelect.selectedIndex];
            const orient = orientationSelect.value;
            let w = parseFloat(option.getAttribute('data-w'));
            let h = parseFloat(option.getAttribute('data-h'));
            
            // قلب الأبعاد إذا كان الاتجاه أفقي
            if (orient === 'l') {
                return {
                    id: option.value,
                    orient: 'l',
                    name: option.text.split('(')[0].trim() + ' (أفقي)',
                    w: h,
                    h: w
                };
            } else {
                return {
                    id: option.value,
                    orient: 'p',
                    name: option.text.split('(')[0].trim() + ' (عمودي)',
                    w: w,
                    h: h
                };
            }
        }

        function buildGrid() {
            gridContainer.innerHTML = "";
            const paper = getPaperDims();

            printPage.style.width = `${paper.w}mm`;
            printPage.style.height = `${paper.h}mm`;

            const imgWidthCm = parseFloat(document.getElementById('widthInput').value) || 5;
            const imgHeightCm = parseFloat(document.getElementById('heightInput').value) || 5;
            const gapMm = parseFloat(document.getElementById('gapInput').value) || 1; 
            const marginMm = parseFloat(document.getElementById('marginInput').value) || 0;

            const imgWidthMm = imgWidthCm * 10;
            const imgHeightMm = imgHeightCm * 10;

            const availableW = paper.w - (marginMm * 2);
            const availableH = paper.h - (marginMm * 2);

            const cols = Math.floor((availableW + gapMm) / (imgWidthMm + gapMm));
            const rows = Math.floor((availableH + gapMm) / (imgHeightMm + gapMm));

            if (cols <= 0 || rows <= 0) return;

            gridContainer.style.gridTemplateColumns = `repeat(${cols}, ${imgWidthCm}cm)`;
            gridContainer.style.gap = `${gapMm}mm`;
            printPage.style.paddingTop = `${marginMm}mm`;

            const actualGridWidthMm = (cols * imgWidthMm) + ((cols - 1) * gapMm);
            const actualGridHeightMm = (rows * imgHeightMm) + ((rows - 1) * gapMm);
            
            gridContainer.style.width = `${actualGridWidthMm}mm`;
            gridContainer.style.height = `${actualGridHeightMm}mm`;

            const totalPhotos = cols * rows;

            for (let i = 0; i < totalPhotos; i++) {
                const cell = document.createElement('div');
                cell.className = 'photo-cell';
                cell.style.width = `${imgWidthCm}cm`;
                cell.style.height = `${imgHeightCm}cm`;
                cell.style.backgroundImage = `url(${originalImageSrc})`;
                gridContainer.appendChild(cell);
            }
        }

        function processImage(imgObj, targetW, targetH) {
            const canvas = document.createElement('canvas');
            canvas.width = targetW * 118.11; 
            canvas.height = targetH * 118.11;
            const ctx = canvas.getContext('2d');
            const imgRatio = imgObj.width / imgObj.height;
            const targetRatio = canvas.width / canvas.height;
            let sx, sy, sw, sh;
            if (imgRatio > targetRatio) {
                sh = imgObj.height;
                sw = imgObj.height * targetRatio;
                sx = (imgObj.width - sw) / 2;
                sy = 0;
            } else {
                sw = imgObj.width;
                sh = imgObj.width / targetRatio;
                sx = 0;
                sy = (imgObj.height - sh) / 2;
            }
            ctx.drawImage(imgObj, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', 1.0);
        }

        document.getElementById('previewBtn').addEventListener('click', async () => {
            if (!originalImageSrc) return alert("يرجى رفع صورة أولاً للمعاينة!");
            
            buildGrid(); 
            const paper = getPaperDims();
            modalPaperLabel.innerText = `شكل الطباعة على ${paper.name}`;
            
            await new Promise(r => setTimeout(r, 50));
            html2canvas(printPage, { scale: 1.5, useCORS: true }).then(canvas => {
                modalImg.src = canvas.toDataURL('image/jpeg', 0.9);
                previewModal.classList.remove('hidden'); 
            });
        });

        closeModalBtn.addEventListener('click', () => {
            previewModal.classList.add('hidden');
            modalImg.src = "";
        });

        document.getElementById('downloadJPG').addEventListener('click', async () => {
            if (!originalImageSrc) return alert("يرجى رفع صورة أولاً!");
            
            buildGrid();
            await new Promise(r => setTimeout(r, 100));

            html2canvas(gridContainer, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `تصميم_مقصوص_${document.getElementById('widthInput').value}سم.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            });
        });

        document.getElementById('downloadPDF').addEventListener('click', () => {
            if (!originalImageSrc) return alert("يرجى رفع صورة أولاً!");
            
            const paper = getPaperDims();
            const { jsPDF } = window.jspdf;
            
            // تمرير الاتجاه (p للعمودي، l للأفقي) لمكتبة PDF
            const doc = new jsPDF(paper.orient, 'mm', paper.id); 

            const imgWidthCm = parseFloat(document.getElementById('widthInput').value) || 5;
            const imgHeightCm = parseFloat(document.getElementById('heightInput').value) || 5;
            const gapMm = parseFloat(document.getElementById('gapInput').value) || 1;
            const marginMm = parseFloat(document.getElementById('marginInput').value) || 0;

            const imgWidthMm = imgWidthCm * 10;
            const imgHeightMm = imgHeightCm * 10;

            const availableW = paper.w - (marginMm * 2);
            const availableH = paper.h - (marginMm * 2);

            const cols = Math.floor((availableW + gapMm) / (imgWidthMm + gapMm));
            const rows = Math.floor((availableH + gapMm) / (imgHeightMm + gapMm));

            const actualGridWidth = (cols * imgWidthMm) + ((cols - 1) * gapMm);
            const startX = (paper.w - actualGridWidth) / 2; 

            const img = new Image();
            img.src = originalImageSrc;
            img.onload = function() {
                const processedDataUrl = processImage(img, imgWidthCm, imgHeightCm);
                let y = marginMm;

                for (let r = 0; r < rows; r++) {
                    let x = startX;
                    for (let c = 0; c < cols; c++) {
                        doc.addImage(processedDataUrl, 'JPEG', x, y, imgWidthMm, imgHeightMm, undefined, 'FAST');
                        doc.setDrawColor(210, 215, 223);
                        doc.setLineWidth(0.1);
                        doc.rect(x, y, imgWidthMm, imgHeightMm);
                        x += imgWidthMm + gapMm;
                    }
                    y += imgHeightMm + gapMm;
                }
                
                doc.save(`طباعة_${paper.id}_${paper.orient === 'l' ? 'أفقي' : 'عمودي'}_${imgWidthCm}x${imgHeightCm}سم.pdf`);
            };
        });
    </script>
</body>
</html>
