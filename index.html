<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مكتبة المصطفى</title>
<style>
  body {
    font-family: "Tahoma", sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  header {
    background: linear-gradient(135deg, #2c3e50, #27ae60);
    color: white;
    padding: 40px 20px;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  main {
    margin: 40px auto;
    max-width: 600px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  h2 {
    margin-bottom: 20px;
    color: #2c3e50;
  }
  #buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }
  .page-btn {
    background: #27ae60;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .page-btn:hover {
    background: #2ecc71;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <header>
    مرحبا بكم في نظام مكتبة المصطفى
  </header>

  <main>
    <h2>الصفحات المتاحة</h2>
    <div id="buttons"></div>
  </main>

<script>
  // اسم المستخدم والمستودع الخاص بك
  const username = "MUSTAFA-mbx5";
  const repo = "mustafa";

  // جلب قائمة الملفات من GitHub API
  fetch(`https://api.github.com/repos/${username}/${repo}/contents/`)
    .then(res => res.json())
    .then(files => {
      const container = document.getElementById("buttons");
      files.forEach(file => {
        if(file.name.endsWith(".html") && file.name !== "index.html"){
          const btn = document.createElement("button");
          btn.className = "page-btn";
          btn.textContent = file.name.replace(".html","");
          btn.onclick = () => window.location.href = file.name;
          container.appendChild(btn);
        }
      });
    })
    .catch(err => console.error("خطأ في جلب الملفات:", err));
</script>
</body>
</html>
