<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>مكتبة المصطفى</title>
<style>
  body {
    font-family: "Tahoma", sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  header {
    background: linear-gradient(135deg, #2c3e50, #27ae60);
    color: white;
    padding: 40px 20px;
    font-size: 28px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  main {
    margin: 40px auto;
    max-width: 600px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  h2 {
    margin-bottom: 20px;
    color: #2c3e50;
  }
  #buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }
  .page-btn {
    background: #27ae60;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }
  .page-btn:hover {
    background: #2ecc71;
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <header>
    مرحبا بكم في نظام مكتبة المصطفى
  </header>

  <main>
    <h2>الصفحات المتاحة</h2>
    <div id="buttons"></div>
  </main>

<script>
  // هنا ضع أسماء ملفات HTML الموجودة في المشروع
  const pages = [
    "index",

  ];

  const container = document.getElementById("buttons");

  pages.forEach(page => {
    const btn = document.createElement("button");
    btn.className = "page-btn";
    btn.textContent = page; // يظهر الاسم بدون الامتداد
    btn.onclick = () => window.location.href = page + ".html";
    container.appendChild(btn);
  });
</script>
</body>
</html>
