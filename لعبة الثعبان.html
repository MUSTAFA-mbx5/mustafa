<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>🐍 لعبة الثعبان |  اتونس لضوجة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #1a2639 0%, #0d1b2a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .game-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border-radius: 48px;
      padding: 25px 25px 30px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 215, 150, 0.3);
      border: 1px solid rgba(255, 180, 100, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
      padding: 0 8px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .score-panel {
      background: #0b121c;
      border-radius: 100px;
      padding: 12px 28px;
      color: #f7e3b2;
      font-weight: bold;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 0 #3e2e1f, 0 12px 20px rgba(0,0,0,0.5);
      border-bottom: 2px solid #ffb86c;
      letter-spacing: 1px;
    }

    .score-panel span {
      color: #ffaa5e;
      margin-left: 8px;
    }

    .level-badge {
      background: #ff7b4a;
      color: #0a0f1c;
      border-radius: 40px;
      padding: 10px 26px;
      font-weight: bold;
      font-size: 1.4rem;
      box-shadow: 0 5px 0 #7b3f1f, 0 8px 18px rgba(255, 100, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(180deg, #ff9f5b 0%, #e55d2b 100%);
    }

    .difficulty-selector {
      display: flex;
      gap: 8px;
      background: rgba(10, 20, 30, 0.8);
      border-radius: 40px;
      padding: 6px;
      backdrop-filter: blur(12px);
      margin-bottom: 15px;
      width: 100%;
      justify-content: center;
    }

    .diff-btn {
      background: #2a3544;
      border: none;
      color: #c0b090;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Cairo', sans-serif;
      box-shadow: 0 3px 0 #10161e;
      white-space: nowrap;
    }

    .diff-btn.active {
      background: #f08a4b;
      color: #0a0f1c;
      box-shadow: 0 4px 0 #7b3f1f, 0 6px 14px rgba(255, 130, 30, 0.6);
      transform: scale(1.05);
      font-weight: bold;
    }

    .diff-btn:hover {
      background: #3e4d5e;
      color: #f5e0b0;
    }

    .diff-btn.active:hover {
      background: #f59a5c;
    }

    canvas {
      border-radius: 40px;
      background: #0f1822;
      box-shadow: inset 0 0 30px #000000, 0 25px 35px rgba(0, 0, 0, 0.7);
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #c9a063;
      background-image: radial-gradient(circle at 20% 20%, #1f2c3a 5%, #0b1219 80%);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 22px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .arrow-panel {
      display: flex;
      gap: 12px;
      background: rgba(10, 20, 30, 0.7);
      border-radius: 60px;
      padding: 12px 20px;
      backdrop-filter: blur(12px);
    }

    .btn {
      background: #2a3544;
      border: none;
      color: #f0dbb0;
      font-size: 2rem;
      font-weight: bold;
      width: 58px;
      height: 58px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 0 #10161e, 0 8px 14px black;
      transition: all 0.08s ease;
      background: radial-gradient(circle at 30% 30%, #4a5b6b, #1b2531);
      user-select: none;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0b0f14, 0 5px 10px black;
      background: radial-gradient(circle at 30% 30%, #5f7388, #1f2b38);
    }

    .restart-btn {
      background: #d44c2f;
      color: #ffefcf;
      font-size: 1.4rem;
      padding: 14px 30px;
      border-radius: 40px;
      background: radial-gradient(circle at 20% 30%, #f97b4f, #aa2f1e);
      box-shadow: 0 7px 0 #621e0f, 0 10px 18px black;
      width: auto;
      height: auto;
      gap: 6px;
      white-space: nowrap;
    }

    .message-area {
      color: #ffcf9a;
      font-size: 1.2rem;
      margin-right: 15px;
      font-weight: bold;
      text-shadow: 0 2px 5px black;
      text-align: center;
    }

    /* نافذة الفوز */
    .win-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .win-message {
      background: linear-gradient(135deg, #1b3a1b, #0d2b0d);
      border: 3px solid #fbbf24;
      border-radius: 30px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 0 60px #fbbf24, 0 20px 40px black;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 40px #fbbf24; }
      50% { transform: scale(1.03); box-shadow: 0 0 80px #ffd700; }
      100% { transform: scale(1); box-shadow: 0 0 40px #fbbf24; }
    }

    .win-message h2 {
      color: #ffd700;
      font-size: 2.5rem;
      margin-bottom: 15px;
      text-shadow: 0 0 20px gold;
    }

    .win-message .alawi-text {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: bold;
      margin: 15px 0;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 15px gold);
    }

    .win-message .nassriya {
      color: #ffb703;
      font-size: 1.5rem;
      margin: 10px 0;
    }

    .win-message button {
      background: #fbbf24;
      color: #1a1a1a;
      border: none;
      padding: 15px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 6px 0 #b45309;
      transition: 0.1s;
      font-family: 'Cairo', sans-serif;
    }

    .win-message button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b45309;
    }

    @media (max-width: 550px) {
      .btn {
        width: 48px;
        height: 48px;
        font-size: 1.7rem;
      }
      .restart-btn {
        padding: 10px 20px;
        font-size: 1.2rem;
      }
      .diff-btn {
        padding: 8px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px;">
  <div class="game-container">
    <div class="header">
      <div class="score-panel">
        🍎 <span id="scoreDisplay">0</span>
      </div>
      <div class="level-badge">
        ⚡ <span id="difficultyLabel">متوسط</span>
      </div>
    </div>

    <!-- اختيار الصعوبة -->
    <div class="difficulty-selector">
      <button class="diff-btn" data-diff="easy">🐢 سهل</button>
      <button class="diff-btn active" data-diff="medium">⚡ متوسط</button>
      <button class="diff-btn" data-diff="hard">🔥 صعب</button>
    </div>

    <canvas id="snakeCanvas" width="400" height="400" aria-label="لعبة الثعبان"></canvas>

    <div class="controls">
      <div class="arrow-panel">
        <button class="btn" id="btnUp" title="أعلى">▲</button>
        <button class="btn" id="btnLeft" title="يسار">◀</button>
        <button class="btn" id="btnDown" title="أسفل">▼</button>
        <button class="btn" id="btnRight" title="يمين">▶</button>
      </div>
      <button class="btn restart-btn" id="restartButton">
        <span>↺</span> جديدة
      </button>
    </div>
    <div class="message-area" id="statusMessage">🎮 اجمع ١٠٠ تفاحة للفوز!</div>
  </div>
  <div style="color:#b9a577; margin-top: 12px; font-size: 0.9rem; text-align: center;">✨ الهدف: ١٠٠ تفاحة | فواكه ذهبية = +٥ نقاط</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    // عناصر واجهة المستخدم
    const scoreSpan = document.getElementById('scoreDisplay');
    const difficultyLabel = document.getElementById('difficultyLabel');
    const statusDiv = document.getElementById('statusMessage');

    // إعدادات اللوحة
    const GRID_SIZE = 20;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    // إعدادات الصعوبة
    const difficulties = {
      easy: { name: 'سهل', speed: 150, label: '🐢 سهل' },
      medium: { name: 'متوسط', speed: 110, label: '⚡ متوسط' },
      hard: { name: 'صعب', speed: 70, label: '🔥 صعب' }
    };
    let currentDifficulty = 'medium';

    // متغيرات اللعبة
    let snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10}
    ];
    let food = {x: 15, y: 10};
    let specialFood = null;
    let specialFoodTimer = 0;

    let direction = 'right';
    let nextDirection = 'right';
    let score = 0;
    let gameOver = false;
    let gameWon = false;
    let gameLoopInterval = null;
    let gameSpeed = difficulties[currentDifficulty].speed;

    // منع الانعكاس الذاتي
    const oppositeDirections = {
      'up': 'down',
      'down': 'up',
      'left': 'right',
      'right': 'left'
    };

    // ========== دوال مساعدة ==========
    function randomGridPosition() {
      return {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE)
      };
    }

    function isPositionOccupied(pos, includeSpecial = true) {
      for (let segment of snake) {
        if (segment.x === pos.x && segment.y === pos.y) return true;
      }
      if (food && food.x === pos.x && food.y === pos.y) return true;
      if (includeSpecial && specialFood && specialFood.x === pos.x && specialFood.y === pos.y) return true;
      return false;
    }

    function generateFood() {
      if (!food) {
        let newFood = randomGridPosition();
        while (isPositionOccupied(newFood, true)) {
          newFood = randomGridPosition();
        }
        food = newFood;
      }
    }

    function trySpawnSpecialFood() {
      if (specialFood !== null) return;
      if (Math.random() < 0.4 && !gameOver && !gameWon) {
        let candidate = randomGridPosition();
        let attempts = 0;
        while (isPositionOccupied(candidate, true) && attempts < 100) {
          candidate = randomGridPosition();
          attempts++;
        }
        if (!isPositionOccupied(candidate, true)) {
          specialFood = candidate;
          specialFoodTimer = 60;
        }
      }
    }

    // دالة الفوز
    function checkWinCondition() {
      if (score >= 100 && !gameWon && !gameOver) {
        gameWon = true;
        gameOver = true; // نوقف الحركة أيضاً
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
        showWinScreen();
        return true;
      }
      return false;
    }

    function showWinScreen() {
      // إزالة أي نافذة فوز سابقة
      const existingOverlay = document.querySelector('.win-overlay');
      if (existingOverlay) existingOverlay.remove();

      const overlay = document.createElement('div');
      overlay.className = 'win-overlay';
      overlay.innerHTML = `
        <div class="win-message">
          <h2>🎉 مبروك ربحت! 🎉</h2>
          <div class="alawi-text">علاوي الناصرية</div>
          <div class="nassriya">🇮🇶 يا بطل يا ناصري 🇮🇶</div>
          <p style="color:#ffd700; font-size:1.2rem;">جمعت ١٠٠ تفاحة!</p>
          <button id="playAgainFromWin">🔄 العب من جديد</button>
        </div>
      `;
      document.body.appendChild(overlay);

      document.getElementById('playAgainFromWin').addEventListener('click', () => {
        overlay.remove();
        resetGame();
      });

      statusDiv.textContent = '🏆 فوز عظيم! علاوي الناصرية يبارك لك';
    }

    function resetGame() {
      // إزالة نافذة الفوز إن وجدت
      const overlay = document.querySelector('.win-overlay');
      if (overlay) overlay.remove();

      if (gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = null;
      }

      snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
      ];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      gameSpeed = difficulties[currentDifficulty].speed;
      gameOver = false;
      gameWon = false;
      food = null;
      specialFood = null;
      specialFoodTimer = 0;

      updateUI();
      generateFood();
      trySpawnSpecialFood();

      statusDiv.textContent = '🎮 اجمع ١٠٠ تفاحة للفوز!';
      startGameLoop();
      drawCanvas();
    }

    function updateUI() {
      scoreSpan.textContent = score;
      difficultyLabel.textContent = difficulties[currentDifficulty].label;
    }

    // ========== حركة الثعبان ==========
    function moveSnake() {
      if (gameOver || gameWon) return false;

      if (nextDirection && oppositeDirections[nextDirection] !== direction) {
        direction = nextDirection;
      }

      const head = snake[0];
      let newHead = {x: head.x, y: head.y};

      switch (direction) {
        case 'right': newHead.x++; break;
        case 'left':  newHead.x--; break;
        case 'down':  newHead.y++; break;
        case 'up':    newHead.y--; break;
        default: break;
      }

      // اصطدام بالجدران
      if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
        gameOver = true;
        statusDiv.textContent = '💥 اصطدمت بالحائط! اضغط "جديدة"';
        return false;
      }

      const willEatFood = (food && newHead.x === food.x && newHead.y === food.y);
      const willEatSpecial = (specialFood && newHead.x === specialFood.x && newHead.y === specialFood.y);

      // فحص التصادم مع الجسم
      let bodyCollision = false;
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        if (segment.x === newHead.x && segment.y === newHead.y) {
          if (i === snake.length - 1 && !willEatFood && !willEatSpecial) {
            continue;
          }
          bodyCollision = true;
          break;
        }
      }

      if (bodyCollision) {
        gameOver = true;
        statusDiv.textContent = '😵 اصطدمت بنفسك! حاول مجدداً.';
        return false;
      }

      snake.unshift(newHead);

      if (willEatFood) {
        score += 1;
        food = null;
        updateUI();
        generateFood();
        trySpawnSpecialFood();
        statusDiv.textContent = `🍎 +1 نقطة | المجموع: ${score} | الهدف: ١٠٠`;
        checkWinCondition();
      }
      else if (willEatSpecial) {
        score += 5;
        specialFood = null;
        specialFoodTimer = 0;
        updateUI();
        generateFood();
        statusDiv.textContent = `✨ +5 نقاط! المجموع: ${score} | الهدف: ١٠٠`;
        checkWinCondition();
      }
      else {
        snake.pop();
      }

      // مؤقت الطعام الخاص
      if (specialFood !== null) {
        specialFoodTimer--;
        if (specialFoodTimer <= 0) {
          specialFood = null;
          specialFoodTimer = 0;
        }
      } else {
        if (Math.random() < 0.08 && !gameOver && !gameWon) {
          trySpawnSpecialFood();
        }
      }

      return true;
    }

    function step() {
      if (gameOver || gameWon) {
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
        return;
      }

      moveSnake();
      drawCanvas();

      if (gameOver && !gameWon) {
        if (gameLoopInterval) {
          clearInterval(gameLoopInterval);
          gameLoopInterval = null;
        }
        drawCanvas();
      }
    }

    // ========== الرسم ==========
    function drawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // شبكة خفيفة
      ctx.strokeStyle = 'rgba(200, 170, 110, 0.12)';
      ctx.lineWidth = 0.6;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // طعام عادي
      if (food) {
        const fx = food.x * CELL_SIZE, fy = food.y * CELL_SIZE;
        ctx.shadowColor = '#ff5e4d';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ff3b3b';
        ctx.beginPath();
        ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE/2.4, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ff7b6b';
        ctx.arc(fx + CELL_SIZE/2.8, fy + CELL_SIZE/2.8, CELL_SIZE/7, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#f9f3d9';
        ctx.shadowBlur = 8;
        ctx.arc(fx + CELL_SIZE/2.5, fy + CELL_SIZE/3.5, CELL_SIZE/11, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#7ec850';
        ctx.beginPath();
        ctx.ellipse(fx + CELL_SIZE/1.8, fy + CELL_SIZE/4, 3, 5, 0.2, 0, Math.PI*2);
        ctx.fill();
      }

      // طعام خاص
      if (specialFood) {
        const sx = specialFood.x * CELL_SIZE, sy = specialFood.y * CELL_SIZE;
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(sx + CELL_SIZE/2, sy + CELL_SIZE/2, CELL_SIZE/2.3, 0, 2*Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fde68a';
        ctx.arc(sx + CELL_SIZE/2.3, sy + CELL_SIZE/2.5, CELL_SIZE/7, 0, 2*Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.arc(sx + CELL_SIZE/2.4, sy + CELL_SIZE/3.2, CELL_SIZE/13, 0, 2*Math.PI);
        ctx.fill();
        ctx.font = `${CELL_SIZE*0.7}px "Segoe UI"`;
        ctx.fillStyle = '#ffd966';
        ctx.shadowBlur = 8;
        ctx.fillText('⭐', sx + 2, sy + CELL_SIZE-3);
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      // ثعبان
      for (let i = 0; i < snake.length; i++) {
        const seg = snake[i];
        const segX = seg.x * CELL_SIZE, segY = seg.y * CELL_SIZE;
        let gradient;
        if (i === 0) {
          gradient = ctx.createRadialGradient(segX+4, segY+4, 2, segX+12, segY+12, 14);
          gradient.addColorStop(0, '#b5ff7a');
          gradient.addColorStop(0.7, '#2e8b57');
        } else {
          gradient = ctx.createRadialGradient(segX+5, segY+5, 2, segX+12, segY+12, 13);
          gradient.addColorStop(0, '#c7f0a4');
          gradient.addColorStop(0.8, '#1f6d4a');
        }
        ctx.shadowColor = '#101010';
        ctx.shadowBlur = 6;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.roundRect(segX + 2, segY + 2, CELL_SIZE - 4, CELL_SIZE - 4, i===0 ? 8 : 7);
        ctx.fill();

        if (i === 0) {
          ctx.fillStyle = 'white';
          ctx.shadowBlur = 4;
          ctx.beginPath();
          ctx.arc(segX + 13, segY + 8, 3.5, 0, Math.PI*2);
          ctx.fill();
          ctx.arc(segX + 7, segY + 8, 3.2, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#0a0f1c';
          ctx.arc(segX + 14, segY + 7, 1.8, 0, Math.PI*2);
          ctx.fill();
          ctx.arc(segX + 8, segY + 7, 1.6, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = 'white';
          ctx.arc(segX + 15, segY + 6, 0.7, 0, Math.PI*2);
          ctx.fill();
          ctx.arc(segX + 9, segY + 6, 0.6, 0, Math.PI*2);
          ctx.fill();
        }
      }

      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // شريط التقدم
      const progressWidth = (score / 100) * canvas.width;
      if (progressWidth > 0 && !gameWon) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
        ctx.fillRect(0, canvas.height - 8, Math.min(progressWidth, canvas.width), 8);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(0, canvas.height - 8, canvas.width, 8);
      }

      // نص النهاية
      if (gameOver && !gameWon) {
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#1e1b2c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        ctx.font = 'bold 22px "Cairo", "Segoe UI"';
        ctx.fillStyle = '#fbc490';
        ctx.shadowColor = '#3a1e1e';
        ctx.shadowBlur = 14;
        ctx.textAlign = 'center';
        ctx.fillText('انتهت اللعبة', canvas.width/2, canvas.height/2-10);
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
      }

      if (gameWon) {
        ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 20px "Cairo"';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 فوز! 🏆', canvas.width/2, canvas.height/2);
      }
    }

    // roundRect
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      this.closePath();
      return this;
    };

    // ========== التحكم ==========
    function changeDirection(newDir) {
      if (gameOver || gameWon) return;
      if (oppositeDirections[newDir] !== direction) {
        nextDirection = newDir;
      }
    }

    // تغيير الصعوبة
    function setDifficulty(diff) {
      if (currentDifficulty === diff) return;
      currentDifficulty = diff;
      gameSpeed = difficulties[diff].speed;
      updateUI();

      // تحديث الأزرار
      document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.diff === diff) btn.classList.add('active');
      });

      // إعادة تشغيل الحلقة بالسرعة الجديدة
      if (!gameOver && !gameWon && gameLoopInterval) {
        clearInterval(gameLoopInterval);
        gameLoopInterval = setInterval(step, gameSpeed);
      }

      statusDiv.textContent = `⚙️ الصعوبة: ${difficulties[diff].name} | اجمع ١٠٠ تفاحة!`;
    }

    // لوحة المفاتيح
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      e.preventDefault();
      if (key === 'ArrowUp' || key === 'w' || key === 'W') changeDirection('up');
      else if (key === 'ArrowDown' || key === 's' || key === 'S') changeDirection('down');
      else if (key === 'ArrowLeft' || key === 'a' || key === 'A') changeDirection('left');
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') changeDirection('right');
      else if (key === 'r' || key === 'R') resetGame();
    });

    // أزرار الواجهة
    document.getElementById('btnUp').addEventListener('click', () => changeDirection('up'));
    document.getElementById('btnDown').addEventListener('click', () => changeDirection('down'));
    document.getElementById('btnLeft').addEventListener('click', () => changeDirection('left'));
    document.getElementById('btnRight').addEventListener('click', () => changeDirection('right'));
    document.getElementById('restartButton').addEventListener('click', resetGame);

    // أزرار الصعوبة
    document.querySelectorAll('.diff-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setDifficulty(btn.dataset.diff);
      });
    });

    window.addEventListener('keydown', function(e) {
      if (e.key.startsWith('Arrow')) {
        e.preventDefault();
      }
    }, {passive: false});

    function startGameLoop() {
      if (gameLoopInterval) clearInterval(gameLoopInterval);
      if (!gameOver && !gameWon) {
        gameLoopInterval = setInterval(step, gameSpeed);
      }
    }

    // تهيئة
    generateFood();
    trySpawnSpecialFood();
    updateUI();
    drawCanvas();
    startGameLoop();
  })();
</script>
</body>
</html>
