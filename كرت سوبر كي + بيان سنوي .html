<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إنشاء بطاقة الحماية الاجتماعية</title>
<!-- تحميل مكتبة html2canvas لحفظ الكارت كصورة -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
    /* ===== التصميم العام ===== */
    * { box-sizing: border-box; }
    body {
        font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 500px;
    }

    h1 {
        text-align: center;
        color: #2c3e50;
        font-size: 24px;
        margin-bottom: 25px;
        text-shadow: 1px 1px 1px rgba(0,0,0,0.1);
    }

    /* ===== نموذج الإدخال ===== */
    .form-box {
        background: #fff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        border: 1px solid #eee;
    }

    label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
        margin-top: 15px;
    }

    label:first-child { margin-top: 0; }

    input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 15px;
        font-family: inherit;
        transition: all 0.3s;
        background: #fafafa;
    }

    input:focus {
        border-color: #3498db;
        background: #fff;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        outline: none;
    }

    .error {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 15px;
        text-align: center;
        display: none;
        font-weight: bold;
    }

    /* ===== أزرار النموذج ===== */
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-generate {
        background: #27ae60;
        color: white;
    }
    .btn-generate:hover { background: #219150; }

    .btn-reset {
        background: #95a5a6;
        color: white;
    }
    .btn-reset:hover { background: #7f8c8d; }

    /* ===== تصميم الكارت الجديد ===== */
    #cardWrapper {
        display: none; /* مخفي افتراضياً لحين إدخال البيانات */
        margin-top: 40px;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
    }

    #card {
        width: 85.6mm; 
        height: 53.98mm;
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        border-radius: 12px;
        padding: 15px;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        border: 1px solid #ddd;
        direction: rtl;
    }

    /* خلفية مائية خفيفة */
    #card::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233498db" opacity="0.05"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>') no-repeat center;
        background-size: contain;
        z-index: 0;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid #3498db;
        padding-bottom: 5px;
        z-index: 1;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo-placeholder {
        width: 38px;
        height: 38px;
        background: #3498db;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 16px;
    }

    .header-text .main-title {
        font-size: 15px;
        font-weight: bold;
        color: #2c3e50;
        margin: 0;
    }
    .header-text .sub-title {
        font-size: 9px;
        color: #7f8c8d;
        margin: 0;
    }

    .header-left .card-id {
        font-size: 10px;
        color: #95a5a6;
    }

    .card-body {
        z-index: 1;
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .data-row {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed #eee;
        padding-bottom: 2px;
    }
    .data-row:last-child { border-bottom: none; }

    .data-row .label {
        font-size: 11px;
        font-weight: bold;
        color: #3498db;
    }
    .data-row .value {
        font-size: 11px;
        color: #333;
        text-align: left;
        max-width: 60%;
        word-break: break-all;
    }

    .card-footer {
        z-index: 1;
        text-align: center;
        font-size: 8.5px;
        color: #7f8c8d;
        border-top: 1px solid #eee;
        padding-top: 4px;
        margin-top: 4px;
    }

    /* ===== أزرار التحكم بالكارت (تحت الكارت مباشرة) ===== */
    .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        width: 100%;
    }
    
    .btn-action {
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        border: none;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: bold;
        transition: background 0.2s;
        flex: 1;
        min-width: 120px;
    }

    .btn-print { background: #34495e; }
    .btn-print:hover { background: #2c3e50; }

    .btn-download { background: #e67e22; }
    .btn-download:hover { background: #d35400; }

    .btn-new { background: #7f8c8d; }
    .btn-new:hover { background: #6c7a89; }

    @media print {
        body * { visibility: hidden; }
        #cardWrapper, #cardWrapper * { visibility: visible; }
        #cardWrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex !important;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: white;
        }
        #card {
            box-shadow: none;
            border: 1px solid #000;
        }
        .card-actions, .form-box, h1 { display: none; }
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>نظام إنشاء بطاقة الحماية الاجتماعية</h1>

    <!-- نموذج إدخال البيانات -->
    <div class="form-box" id="formBox">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" placeholder="أدخل الاسم الكامل">

        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="أدخل رقم الهاتف">

        <label for="careNumber">رقم بطاقة الرعاية</label>
        <input type="text" id="careNumber" placeholder="أدخل رقم بطاقة الرعاية">

        <label for="date1">تاريخ الموعد الحالي</label>
        <input type="date" id="date1">

        <label for="date2">تاريخ الموعد القادم</label>
        <input type="date" id="date2">

        <label for="code">الرمز السري</label>
        <input type="text" id="code" placeholder="أدخل الرمز السري">

        <div class="error" id="errorMsg">⚠️ الرجاء تعبئة جميع الحقول قبل إنشاء الكارت</div>

        <div class="form-actions">
            <button class="btn-generate" onclick="generateCard()">
                <span>📋</span> إنشاء الكارت
            </button>
            <button class="btn-reset" onclick="resetForm()">
                <span>🔄</span> مسح الحقول
            </button>
        </div>
    </div>

    <!-- منطقة عرض الكارت والأزرار -->
    <div id="cardWrapper">
        <div id="card">
            <div class="card-header">
                <div class="header-right">
                    <div class="logo-placeholder">IQ</div>
                    <div class="header-text">
                        <div class="main-title">جمهورية العراق</div>
                        <div class="sub-title">وزارة العمل والشؤون الاجتماعية</div>
                    </div>
                </div>
                <div class="header-left">
                    <div class="main-title" style="font-size: 11px; color: #c0392b;">الحماية الاجتماعية</div>
                    <div class="card-id">بطاقة مستفيد</div>
                </div>
            </div>

            <div class="card-body">
                <div class="data-row">
                    <span class="label">الاسـم:</span>
                    <span class="value" id="cName"></span>
                </div>
                <div class="data-row">
                    <span class="label">رقم الهاتف:</span>
                    <span class="value" id="cPhone"></span>
                </div>
                <div class="data-row">
                    <span class="label">رقم الرعاية:</span>
                    <span class="value" id="cCareNumber"></span>
                </div>
                <div class="data-row">
                    <span class="label">الموعد الحالي:</span>
                    <span class="value" id="cDate1"></span>
                </div>
                <div class="data-row">
                    <span class="label">الموعد القادم:</span>
                    <span class="value" id="cDate2"></span>
                </div>
                <div class="data-row">
                    <span class="label">الرمز السري:</span>
                    <span class="value" id="cCode"></span>
                </div>
            </div>

            <div class="card-footer">
                جميع الحقوق محفوظة لمكتبة المصطفى | ٠٧٨١٣٩٨٥٨٥٣
            </div>
        </div>

        <!-- أزرار التحكم: طباعة، حفظ كصورة، إنشاء كارت جديد -->
        <div class="card-actions">
            <button class="btn-action btn-print" onclick="window.print()">
                <span>🖨️</span> طباعة الكارت
            </button>
            <button class="btn-action btn-download" onclick="downloadCardAsImage()">
                <span>⬇️</span> حفظ كصورة (HD)
            </button>
            <button class="btn-action btn-new" onclick="newCard()">
                <span>➕</span> كارت جديد
            </button>
        </div>
    </div>
</div>

<script>
function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
}

function generateCard() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const careNumber = document.getElementById('careNumber').value.trim();
    const date1 = document.getElementById('date1').value;
    const date2 = document.getElementById('date2').value;
    const code = document.getElementById('code').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (!name || !phone || !careNumber || !date1 || !date2 || !code) {
        errorMsg.style.display = 'block';
        return;
    }
    errorMsg.style.display = 'none';

    document.getElementById('cName').textContent = name;
    document.getElementById('cPhone').textContent = phone;
    document.getElementById('cCareNumber').textContent = careNumber;
    document.getElementById('cDate1').textContent = formatDate(date1);
    document.getElementById('cDate2').textContent = formatDate(date2);
    document.getElementById('cCode').textContent = code;

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('cardWrapper').style.display = 'flex';
}

function resetForm() {
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('careNumber').value = '';
    document.getElementById('date1').value = '';
    document.getElementById('date2').value = '';
    document.getElementById('code').value = '';
    document.getElementById('errorMsg').style.display = 'none';
}

function newCard() {
    resetForm();
    document.getElementById('formBox').style.display = 'block';
    document.getElementById('cardWrapper').style.display = 'none';
}

// وظيفة حفظ الكارت كصورة عالية الجودة
function downloadCardAsImage() {
    const cardElement = document.getElementById('card');
    
    // استخدام html2canvas لالتقاط الكارت بدقة عالية (Scale 3 لزيادة الجودة)
    html2canvas(cardElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Social-Security-Card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
