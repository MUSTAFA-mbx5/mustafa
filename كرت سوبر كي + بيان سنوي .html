<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إنشاء بطاقة الحماية الاجتماعية</title>
<!-- مكتبة html2canvas لحفظ الكارت كصورة -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 500px;
    }

    h1 {
        text-align: center;
        color: #1a3c5e;
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: 700;
    }

    .form-box {
        background: #fff;
        border-radius: 14px;
        padding: 22px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        border: 1px solid #e1e8ed;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #333;
        margin: 10px 0 5px;
    }

    input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccd9e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        background: #fafbfc;
        transition: border-color 0.2s;
    }

    input:focus {
        border-color: #1a3c5e;
        background: #fff;
    }

    .error {
        color: #c0392b;
        font-size: 13px;
        margin-top: 10px;
        text-align: center;
        display: none;
        font-weight: bold;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: #fff;
        transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }

    .btn-generate { background: #27ae60; }
    .btn-reset { background: #7f8c8d; }

    /* ===== تصميم الكارت (مقاس إجباري 8.5cm طول × 5.5cm ارتفاع) ===== */
    #cardWrapper {
        display: none;
        margin-top: 30px;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        width: 100%;
    }

    #card {
        width: 8.5cm !important;
        height: 5.5cm !important;
        min-width: 8.5cm !important;
        min-height: 5.5cm !important;
        max-width: 8.5cm !important;
        max-height: 5.5cm !important;
        background: linear-gradient(135deg, #ffffff 0%, #f4f8fb 100%);
        border: 1.5px solid #1a3c5e;
        border-radius: 8px;
        padding: 8px 12px;
        position: relative;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        direction: rtl;
    }

    /* خلفية جمالية خفيفة */
    #card::before {
        content: "";
        position: absolute;
        top: -20px;
        right: -20px;
        width: 80px;
        height: 80px;
        background: rgba(26, 60, 94, 0.05);
        border-radius: 50%;
    }

    .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1.5px solid #1a3c5e;
        padding-bottom: 3px;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .logo-box {
        width: 28px;
        height: 28px;
        background: #1a3c5e;
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: bold;
    }

    .header-text .main-title {
        font-size: 12px;
        font-weight: bold;
        color: #1a3c5e;
        margin: 0;
        line-height: 1.1;
    }
    .header-text .sub-title {
        font-size: 8px;
        color: #555;
        margin: 0;
    }

    .card-id-tag {
        font-size: 8.5px;
        background: #1a3c5e;
        color: #fff;
        padding: 1px 5px;
        border-radius: 4px;
        font-weight: bold;
    }

    .card-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 2px;
    }

    .data-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 0.5px dashed #d1dede;
        padding-bottom: 1px;
    }
    .data-row:last-child { border-bottom: none; }

    .data-row .label {
        font-size: 9.5px;
        font-weight: bold;
        color: #1a3c5e;
    }
    .data-row .value {
        font-size: 9.5px;
        color: #222;
        font-weight: 600;
        max-width: 65%;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .card-footer {
        text-align: center;
        font-size: 7.5px;
        color: #444;
        border-top: 1px solid #d1dede;
        padding-top: 2px;
        font-weight: bold;
    }

    /* أزرار التحكم تحت الكارت */
    .card-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        width: 100%;
    }

    .btn-action {
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        border: none;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-weight: bold;
    }

    .btn-print { background: #34495e; }
    .btn-download { background: #e67e22; }
    .btn-whatsapp { background: #25d366; grid-column: span 2; }
    .btn-new { background: #7f8c8d; grid-column: span 2; }

    @media print {
        body * { visibility: hidden; }
        #cardWrapper, #cardWrapper * { visibility: visible; }
        #cardWrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex !important;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: white;
        }
        #card {
            box-shadow: none !important;
            border: 1px solid #1a3c5e !important;
        }
        .card-actions, .form-box, h1 { display: none; }
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>نظام إنشاء بطاقة الحماية الاجتماعية</h1>

    <div class="form-box" id="formBox">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" placeholder="أدخل الاسم الكامل">

        <label for="phone">رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="مثال: 07813985853">

        <label for="careNumber">رقم بطاقة الرعاية</label>
        <input type="text" id="careNumber" placeholder="أدخل رقم بطاقة الرعاية">

        <label for="date1">تاريخ الموعد الحالي (البيان السنوي)</label>
        <input type="date" id="date1" onchange="calculateNextDate()">

        <label for="date2">تاريخ الموعد القادم (بعد 360 يوم)</label>
        <input type="date" id="date2">

        <label for="code">الرمز السري</label>
        <input type="text" id="code" placeholder="أدخل الرمز السري">

        <div class="error" id="errorMsg">⚠️ الرجاء تعبئة جميع الحقول المطلوبة</div>

        <div class="form-actions">
            <button class="btn-generate" onclick="generateCard()">📋 إنشاء الكارت</button>
            <button class="btn-reset" onclick="resetForm()">🔄 مسح</button>
        </div>
    </div>

    <div id="cardWrapper">
        <div id="card">
            <div class="card-header">
                <div class="header-right">
                    <div class="logo-box">IQ</div>
                    <div class="header-text">
                        <div class="main-title">الحماية الاجتماعية</div>
                        <div class="sub-title">وزارة العمل والشؤون الاجتماعية</div>
                    </div>
                </div>
                <div class="card-id-tag">بطاقة مستفيد</div>
            </div>

            <div class="card-body">
                <div class="data-row">
                    <span class="label">الاسـم:</span>
                    <span class="value" id="cName"></span>
                </div>
                <div class="data-row">
                    <span class="label">رقم الهاتف:</span>
                    <span class="value" id="cPhone"></span>
                </div>
                <div class="data-row">
                    <span class="label">رقم الرعاية:</span>
                    <span class="value" id="cCareNumber"></span>
                </div>
                <div class="data-row">
                    <span class="label">الموعد الحالي:</span>
                    <span class="value" id="cDate1"></span>
                </div>
                <div class="data-row">
                    <span class="label">الموعد القادم:</span>
                    <span class="value" id="cDate2"></span>
                </div>
                <div class="data-row">
                    <span class="label">الرمز السري:</span>
                    <span class="value" id="cCode"></span>
                </div>
            </div>

            <div class="card-footer">
                مكتبة المصطفى | 07813985853
            </div>
        </div>

        <div class="card-actions">
            <button class="btn-action btn-print" onclick="window.print()">🖨️ طباعة</button>
            <button class="btn-action btn-download" onclick="downloadCardAsImage()">⬇️ حفظ كصورة</button>
            <button class="btn-action btn-whatsapp" onclick="sendToWhatsApp()">💬 إرسال عبر واتساب</button>
            <button class="btn-action btn-new" onclick="newCard()">➕ كارت جديد</button>
        </div>
    </div>
</div>

<script>
// حساب الموعد القادم بإضافة 360 يوم تلقائياً عند اختيار الموعد الحالي
function calculateNextDate() {
    const date1Val = document.getElementById('date1').value;
    if (date1Val) {
        let d = new Date(date1Val);
        d.setDate(d.getDate() + 360);
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        document.getElementById('date2').value = `${year}-${month}-${day}`;
    }
}

function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
}

let rawPhone = ""; // لحفظ الرقم الأصلي للواتساب

function generateCard() {
    const name = document.getElementById('name').value.trim();
    const phoneInput = document.getElementById('phone').value.trim();
    const careNumber = document.getElementById('careNumber').value.trim();
    const date1 = document.getElementById('date1').value;
    const date2 = document.getElementById('date2').value;
    const code = document.getElementById('code').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (!name || !phoneInput || !careNumber || !date1 || !date2 || !code) {
        errorMsg.style.display = 'block';
        return;
    }
    errorMsg.style.display = 'none';

    rawPhone = phoneInput; // تخزين الرقم

    document.getElementById('cName').textContent = name;
    document.getElementById('cPhone').textContent = phoneInput;
    document.getElementById('cCareNumber').textContent = careNumber;
    document.getElementById('cDate1').textContent = formatDate(date1);
    document.getElementById('cDate2').textContent = formatDate(date2);
    document.getElementById('cCode').textContent = code;

    document.getElementById('formBox').style.display = 'none';
    document.getElementById('cardWrapper').style.display = 'flex';
}

function resetForm() {
    document.getElementById('name').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('careNumber').value = '';
    document.getElementById('date1').value = '';
    document.getElementById('date2').value = '';
    document.getElementById('code').value = '';
    document.getElementById('errorMsg').style.display = 'none';
}

function newCard() {
    resetForm();
    document.getElementById('formBox').style.display = 'block';
    document.getElementById('cardWrapper').style.display = 'none';
}

function downloadCardAsImage() {
    const cardElement = document.getElementById('card');
    html2canvas(cardElement, {
        scale: 4,
        useCORS: true,
        backgroundColor: null
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Social-Security-Card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}

// تعديل الرقم وإرسال التفاصيل عبر واتساب
function sendToWhatsApp() {
    let formattedPhone = rawPhone.replace(/\s+/g, '');
    if (formattedPhone.startsWith('0')) {
        formattedPhone = '+964' + formattedPhone.substring(1);
    } else if (!formattedPhone.startsWith('+')) {
        formattedPhone = '+964' + formattedPhone;
    }

    const name = document.getElementById('cName').textContent;
    const careNumber = document.getElementById('cCareNumber').textContent;
    const date1 = document.getElementById('cDate1').textContent;
    const date2 = document.getElementById('cDate2').textContent;
    const code = document.getElementById('cCode').textContent;

    const message = `مرحباً بك ${name}\nإليك تفاصيل بطاقة الحماية الاجتماعية الخاصة بك:\n\n👤 الاسم: ${name}\n🔢 رقم الرعاية: ${careNumber}\n📅 الموعد الحالي: ${date1}\n📅 الموعد القادم: ${date2}\n🔑 الرمز السري: ${code}\n\nمع تحيات مكتبة المصطفى`;

    const encodedMessage = encodeURIComponent(message);
    const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodedMessage}`;
    window.open(whatsappUrl, '_blank');
}
</script>

</body>
</html>
